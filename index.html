
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADRASHYA INOX | Unlimited Entertainment</title>

<style>
:root {
  --bg: #080808;
  --text: #fff;
  --muted: #aaa;
  --accent: #e50914;
  --card: #181818;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 17px 5%;
  background: rgba(8,8,8,.96);
}

.logo {
  color: var(--accent);
  font-size: 27px;
  font-weight: 900;
  letter-spacing: 1px;
  text-decoration: none;
}

.tagline {
  color: var(--muted);
  font-size: 11px;
  margin-top: 4px;
  letter-spacing: 2px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.search {
  width: 220px;
  padding: 10px 13px;
  border: 1px solid #555;
  border-radius: 5px;
  background: #171717;
  color: white;
  outline: none;
}

.search:focus {
  border-color: var(--accent);
}

.theme-btn {
  background: #333;
  border: 0;
  color: white;
  padding: 10px 13px;
  border-radius: 5px;
  cursor: pointer;
}

/* HERO SLIDESHOW - BLURRED BACKGROUND + ORIGINAL POSTER */

.hero {
  height: 340px;
  min-height: 340px;
  padding: 25px 7%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background-color: #101010;
}

/* Enlarged blurred version of the same poster */

.hero-backdrop {
  position: absolute;
  inset: -25px;
  z-index: 0;
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  filter: blur(20px);
  transform: scale(1.08);
  opacity: .75;
  transition: background-image .4s ease;
}

/* Dark overlay */

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  background:
    linear-gradient(90deg,
      rgba(0,0,0,.65),
      rgba(0,0,0,.18),
      rgba(0,0,0,.65)),
    linear-gradient(0deg,
      rgba(0,0,0,.55),
      rgba(0,0,0,.12));
}

/* Original poster - no cropping */

.hero-poster-wrap {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  padding: 12px;
}

.hero-poster {
  display: block;
  height: 300px;
  width: auto;
  max-width: 42%;
  object-fit: contain;
  border-radius: 5px;
  box-shadow: 0 8px 35px rgba(0,0,0,.65);
  transition: opacity .3s ease;
}

/* Hero title and button */

.hero-content {
  width: 100%;
  max-width: 750px;
  position: absolute;
  z-index: 3;
  left: 5%;
  bottom: 25px;
  pointer-events: none;
}

.hero h1 {
  font-size: clamp(22px,3vw,34px);
  font-weight: 800;
  line-height: 1.2;
  max-width: 400px;
  overflow-wrap: anywhere;
  text-shadow: 0 3px 12px rgba(0,0,0,.95);
}

.hero-watch-btn {
  margin-top: 12px;
  border: 0;
  border-radius: 5px;
  padding: 11px 20px;
  background: var(--accent);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  pointer-events: auto;
}

.hero-watch-btn:hover,
.premium-play:hover {
  background: #b80710;
}

.hero-watch-btn:disabled {
  opacity: .55;
  cursor: not-allowed;
}

/* CATALOGUE */

main {
  padding: 10px 0 50px;
}

.category-section {
  margin: 25px 0 35px;
  content-visibility: auto;
  contain-intrinsic-size: auto 360px;
}

.category-title {
  padding: 0 5%;
  font-size: 23px;
  margin-bottom: 15px;
}

.category-row-block {
  width: 100%;
  margin-bottom: 10px;
}

.row-heading {
  padding: 0 5%;
  margin: 4px 0 8px;
  color: var(--muted);
  font-size: 15px;
  font-weight: 700;
}

.row-shell {
  position: relative;
  width: 100%;
  overflow: hidden;
}

.movie-row {
  display: flex;
  gap: 13px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 5px 5% 18px;
  scrollbar-width: thin;
  scrollbar-color: #555 #151515;
  scroll-behavior: smooth;
  scroll-snap-type: x proximity;
  -webkit-overflow-scrolling: touch;
}

.row-arrow {
  position: absolute;
  z-index: 4;
  top: 38%;
  width: 38px;
  height: 62px;
  border: 0;
  border-radius: 5px;
  background: rgba(0,0,0,.78);
  color: white;
  font-size: 26px;
  cursor: pointer;
  opacity: 0;
  transition: opacity .2s;
}

.row-shell:hover .row-arrow,
.row-arrow:focus {
  opacity: 1;
}

.row-arrow.left { left: 5px; }
.row-arrow.right { right: 5px; }

.movie-card {
  flex: 0 0 175px;
  cursor: pointer;
  transition: transform .25s;
  scroll-snap-align: start;
}

.movie-card:hover {
  transform: scale(1.06);
}

.poster {
  height: 245px;
  position: relative;
  overflow: hidden;
  border-radius: 7px;
  background: #242424;
}

.poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  inset: 0;
  z-index: 1;
}

.poster-placeholder {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px;
  color: var(--muted);
  font-weight: bold;
  overflow-wrap: anywhere;
}

.play-overlay {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.25);
  opacity: 0;
  transition: opacity .2s;
}

.movie-card:hover .play-overlay {
  opacity: 1;
}

.play-icon {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
}

.movie-title {
  font-size: 14px;
  font-weight: bold;
  margin-top: 9px;
  line-height: 1.4;
}

.status {
  text-align: center;
  padding: 30px;
  color: var(--muted);
}

/* CINEMATIC PREMIUM POPUP */

.selection-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 90;
  padding: 25px;
  background: rgba(0,0,0,.88);
  backdrop-filter: blur(9px);
  align-items: center;
  justify-content: center;
}

.selection-modal.show {
  display: flex;
  animation: modalFade .25s ease;
}

@keyframes modalFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.premium-box {
  width: min(1000px, 100%);
  max-height: 92vh;
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
  background: #111;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 15px;
  box-shadow: 0 25px 90px rgba(0,0,0,.8);
  scrollbar-width: thin;
  scrollbar-color: #555 #111;
}

.premium-hero {
  min-height: 430px;
  position: relative;
  display: flex;
  align-items: flex-end;
  padding: 45px;
  background-color: #191919;
  background-size: cover;
  background-position: center;
  isolation: isolate;
}

.premium-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(90deg,rgba(0,0,0,.95) 0%,rgba(0,0,0,.65) 48%,rgba(0,0,0,.15) 100%),
    linear-gradient(0deg,#111 0%,rgba(0,0,0,.15) 75%);
}

.premium-close {
  position: absolute;
  z-index: 5;
  top: 15px;
  right: 17px;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: rgba(0,0,0,.72);
  color: white;
  font-size: 27px;
  cursor: pointer;
  transition: background .2s, transform .2s;
}

.premium-close:hover {
  background: var(--accent);
  transform: rotate(90deg);
}

.premium-content {
  display: flex;
  align-items: flex-end;
  gap: 30px;
  width: 100%;
  position: relative;
  z-index: 2;
}

.premium-poster-wrap {
  flex: 0 0 195px;
}

.premium-poster {
  width: 195px;
  height: 280px;
  display: block;
  object-fit: cover;
  border-radius: 9px;
  background: #252525;
  box-shadow: 0 12px 35px rgba(0,0,0,.65);
}

.premium-info {
  flex: 1;
  min-width: 0;
  padding-bottom: 8px;
}

.premium-title {
  font-size: clamp(26px,4vw,42px);
  line-height: 1.15;
  font-weight: 900;
  overflow-wrap: anywhere;
  text-shadow: 0 3px 15px rgba(0,0,0,.8);
}

.premium-description {
  display: none;
  margin-top: 14px;
  color: #ddd;
  font-size: 14px;
  line-height: 1.6;
}

.premium-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 23px;
}

.premium-play {
  border: 0;
  border-radius: 5px;
  background: var(--accent);
  color: white;
  padding: 13px 25px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: background .2s, transform .2s;
}

.premium-play:hover {
  transform: translateY(-2px);
}

.premium-list {
  width: 47px;
  height: 45px;
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 5px;
  background: rgba(35,35,35,.8);
  color: white;
  font-size: 25px;
  cursor: pointer;
  transition: background .2s;
}

.premium-list:hover,
.premium-list.active {
  background: #444;
  border-color: white;
}

.premium-list-note {
  font-size: 12px;
  color: #aaa;
  margin-top: 9px;
  min-height: 15px;
}

/* MORE LIKE THIS */

.premium-recommendations {
  padding: 20px 30px 30px;
}

.premium-section-title {
  font-size: 19px;
  font-weight: 800;
  margin-bottom: 16px;
}

.recommendation-row {
  display: flex;
  gap: 13px;
  overflow-x: auto;
  padding: 4px 3px 12px;
  scrollbar-width: thin;
  scrollbar-color: #555 #151515;
}

.recommendation-card {
  flex: 0 0 145px;
  cursor: pointer;
  transition: transform .2s;
}

.recommendation-card:hover {
  transform: translateY(-4px);
}

.recommendation-poster {
  width: 100%;
  height: 195px;
  object-fit: cover;
  display: block;
  border-radius: 7px;
  background: #242424;
}

.recommendation-title {
  margin-top: 8px;
  font-size: 13px;
  font-weight: bold;
  line-height: 1.4;
}

/* WEB SERIES EPISODES */

.episode-section {
  display: none;
  padding: 0 30px 25px;
}

.episode-section.show {
  display: block;
}

.episode-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 16px;
}

.episode-header h3 {
  font-size: 19px;
}

.season-select {
  background: #252525;
  color: white;
  border: 1px solid #555;
  border-radius: 5px;
  padding: 9px 12px;
  max-width: 180px;
  outline: none;
}

.episode-list {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 10px;
}

.episode-item {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  padding: 10px;
  border-radius: 7px;
  background: #202020;
  cursor: pointer;
  transition: background .2s;
}

.episode-item:hover {
  background: #333;
}

.episode-number {
  color: #aaa;
  font-size: 18px;
  font-weight: bold;
  min-width: 27px;
}

.episode-name {
  flex: 1;
  min-width: 0;
  font-size: 13px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.episode-play {
  color: white;
  background: var(--accent);
  border-radius: 50%;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* VIDEO PLAYER */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.96);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.show {
  display: flex;
}

.player-box {
  width: min(1100px,100%);
  height: min(650px,85vh);
  position: relative;
  background: #000;
  border-radius: 8px;
  overflow: hidden;
}

.player-box iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.close-btn {
  position: absolute;
  z-index: 5;
  top: 12px;
  right: 15px;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: rgba(0,0,0,.8);
  color: white;
  font-size: 25px;
  cursor: pointer;
}

.player-message {
  position: absolute;
  bottom: 10px;
  left: 10px;
  z-index: 4;
  color: white;
  font-size: 12px;
  pointer-events: none;
}

footer {
  border-top: 1px solid #292929;
  text-align: center;
  padding: 25px;
  color: #777;
  font-size: 12px;
}

/* LIGHT MODE */

body.light {
  --bg: #f2f2f2;
  --text: #151515;
  --muted: #666;
}

body.light header {
  background: rgba(245,245,245,.97);
}

body.light .search {
  background: white;
  color: black;
}

body.light .hero {
  background-color: #333;
}

/* MOBILE */

@media(max-width:650px) {
  header {
    padding: 13px 4%;
    flex-wrap: wrap;
  }

  .logo {
    font-size: 22px;
  }

  .header-right {
    width: 100%;
  }

  .search {
    flex: 1;
    width: 100%;
  }

  .hero {
    height: 260px;
    min-height: 260px;
    padding: 15px 5%;
  }

  .hero-backdrop {
    inset: -18px;
    filter: blur(15px);
  }

  .hero-poster-wrap {
    padding: 10px;
  }

  .hero-poster {
    height: 220px;
    max-width: 55%;
  }

  .hero-content {
    left: 5%;
    bottom: 13px;
  }

  .hero h1 {
    font-size: clamp(17px,5vw,23px);
    max-width: 65%;
  }

  .hero-watch-btn {
    margin-top: 8px;
    padding: 9px 14px;
    font-size: 12px;
  }

  .row-arrow {
    opacity: .85;
    width: 30px;
    height: 48px;
  }

  .movie-card {
    flex-basis: 135px;
  }

  .poster {
    height: 195px;
  }

  .category-title {
    font-size: 19px;
  }

  .selection-modal {
    padding: 8px;
  }

  .premium-box {
    max-height: 94vh;
    border-radius: 11px;
  }

  .premium-hero {
    min-height: 520px;
    padding: 25px 18px;
    background-position: center;
  }

  .premium-hero::before {
    background:
      linear-gradient(0deg,#111 0%,rgba(0,0,0,.65) 50%,rgba(0,0,0,.25) 100%),
      linear-gradient(90deg,rgba(0,0,0,.35),transparent);
  }

  .premium-content {
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 17px;
  }

  .premium-poster-wrap {
    flex: none;
  }

  .premium-poster {
    width: 145px;
    height: 205px;
  }

  .premium-title {
    font-size: 25px;
  }

  .premium-actions {
    justify-content: center;
    margin-top: 17px;
  }

  .premium-recommendations {
    padding: 18px 15px 25px;
  }

  .recommendation-card {
    flex-basis: 115px;
  }

  .recommendation-poster {
    height: 155px;
  }

  .episode-section {
    padding: 0 15px 22px;
  }

  .episode-list {
    grid-template-columns: 1fr;
  }

  .episode-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .season-select {
    max-width: 100%;
    width: 100%;
  }

  .modal {
    padding: 5px;
  }

  .player-box {
    height: 55vh;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <a href="./" class="logo" title="Go to Homepage">ADRASHYA INOX</a>
    <div class="tagline">UNLIMITED ENTERTAINMENT</div>
  </div>

  <div class="header-right">
    <input type="search" id="searchBox" class="search"
      placeholder="Search movies..." autocomplete="off">
    <button class="theme-btn" id="themeBtn">☀ / ☾</button>
  </div>
</header>

<!-- HERO SECTION -->

<section class="hero" id="hero">

  <!-- Blurred background uses the same poster -->
  <div class="hero-backdrop" id="heroBackdrop"></div>

  <!-- Original poster displayed without cropping -->
  <div class="hero-poster-wrap">
    <img id="heroPoster" class="hero-poster"
      alt="Featured movie poster">
  </div>

  <div class="hero-content">
    <h1 id="heroTitle">ADRASHYA INOX</h1>
    <button class="hero-watch-btn" id="heroWatchBtn" type="button">
      ▶ WATCH NOW
    </button>
  </div>

</section>

<main>
  <div id="catalogue">
    <div class="status">Loading your entertainment library...</div>
  </div>
</main>

<!-- CINEMATIC PREMIUM DETAILS POPUP -->

<div class="selection-modal" id="selectionModal">
  <div class="premium-box">

    <button class="premium-close" id="closeSelection"
      aria-label="Close details">×</button>

    <section class="premium-hero" id="premiumHero">
      <div class="premium-content">

        <div class="premium-poster-wrap">
          <img id="selectionPoster" class="premium-poster"
            alt="Movie poster">
        </div>

        <div class="premium-info">
          <h2 class="premium-title" id="selectionTitle"></h2>

          <p class="premium-description" id="selectionDescription"></p>

          <div class="premium-actions">
            <button class="premium-play" id="selectionPlay" type="button">
              ▶ PLAY NOW
            </button>

            <button class="premium-list" id="myListButton"
              type="button" title="Add to My List">＋</button>
          </div>

          <div class="premium-list-note" id="myListNote"></div>
        </div>
      </div>
    </section>

    <!-- WEB SERIES SEASON AND EPISODE SELECTOR -->

    <section class="episode-section" id="episodeSection">
      <div class="episode-header">
        <h3>Episodes</h3>
        <select class="season-select" id="seasonSelect"
          aria-label="Select season"></select>
      </div>

      <div class="episode-list" id="episodeList"></div>
    </section>

    <!-- RECOMMENDATIONS -->

    <section class="premium-recommendations">
      <h3 class="premium-section-title">More Like This</h3>
      <div class="recommendation-row" id="recommendationRow"></div>
    </section>

  </div>
</div>

<!-- PLAYER MODAL -->

<div class="modal" id="playerModal">
  <div class="player-box" id="playerBox">
    <button class="close-btn" id="closePlayer"
      aria-label="Close player">×</button>
    <div class="player-message" id="playerMessage"></div>
  </div>
</div>

<footer>
  ADRASHYA INOX · Unlimited Entertainment
</footer>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbzismKAUniBCM3f9G3kyIMaDBz7KKE0YvZE6kgQcCWCNFBruBEczDej6EiWLE8WvQeB/exec";

const CATEGORIES = ["Movies", "Web Series", "Animation"];

let allMovies = [];
let heroMovies = [];
let heroIndex = 0;
let heroTimer = null;

let selectionMovies = [];
let selectionIndex = 0;
let currentSeriesSeasons = [];

// LOAD GOOGLE DRIVE LIBRARY

const MOVIE_CACHE_KEY = "adrashyaInoxMovieCache_v1";
const MOVIE_CACHE_TTL = 5 * 60 * 1000; // 5 minutes
let apiRequestInProgress = false;

function readMovieCache() {
  try {
    const saved = localStorage.getItem(MOVIE_CACHE_KEY);
    if (!saved) return null;

    const cache = JSON.parse(saved);
    if (
      !cache ||
      !Array.isArray(cache.movies) ||
      !cache.savedAt
    ) return null;

    return cache;
  } catch (error) {
    console.warn("Movie cache could not be read:", error);
    return null;
  }
}

function saveMovieCache(movies) {
  try {
    localStorage.setItem(MOVIE_CACHE_KEY, JSON.stringify({
      savedAt: Date.now(),
      movies: movies
    }));
  } catch (error) {
    // The site still works if browser storage is full or unavailable.
    console.warn("Movie cache could not be saved:", error);
  }
}

function displayMovies(movies) {
  allMovies = movies;
  renderCatalogue(allMovies);
  startHeroSlideshow();
}

function loadMovies() {
  const cache = readMovieCache();
  const cacheIsFresh = cache &&
    (Date.now() - cache.savedAt) < MOVIE_CACHE_TTL;

  // Show saved movies immediately instead of waiting for the Drive API.
  if (cache && cache.movies.length) {
    displayMovies(cache.movies);
  }

  // A fresh cache avoids an API request on every page reload.
  if (cacheIsFresh) return;

  if (apiRequestInProgress) return;
  apiRequestInProgress = true;

  const callbackName = "inoxCallback";
  let requestFinished = false;

  function finishRequest() {
    if (requestFinished) return;
    requestFinished = true;
    apiRequestInProgress = false;
    delete window[callbackName];

    const oldScript = document.getElementById("inoxApiScript");
    if (oldScript) oldScript.remove();
  }

  window[callbackName] = function(data) {
    if (data && Array.isArray(data.movies)) {
      saveMovieCache(data.movies);
      displayMovies(data.movies);
    } else if (!cache || !cache.movies.length) {
      showError("Unexpected API response.");
    }

    finishRequest();
  };

  const script = document.createElement("script");
  script.id = "inoxApiScript";
  script.src = API_URL +
    "?callback=" + callbackName +
    "&t=" + Date.now();

  script.onerror = function() {
    if (!cache || !cache.movies.length) {
      showError("Unable to connect to Google Drive API.");
    }
    finishRequest();
  };

  // Prevent a permanently pending request from blocking future retries.
  const requestTimeout = window.setTimeout(function() {
    if (!requestFinished) {
      if (!cache || !cache.movies.length) {
        showError("Google Drive is taking too long to respond. Please reload.");
      }
      finishRequest();
    }
  }, 15000);

  const originalFinishRequest = finishRequest;
  finishRequest = function() {
    window.clearTimeout(requestTimeout);
    originalFinishRequest();
  };

  document.body.appendChild(script);
}

function showError(message) {
  document.getElementById("catalogue").textContent = message;
}

/* CATEGORY NORMALIZATION */

function normalizeCategory(value) {
  const key = String(value || "")
    .trim()
    .toLowerCase()
    .replace(/[\s_-]+/g, "");

  if (key === "movie" || key === "movies") return "Movies";
  if (key === "webseries" || key === "series") return "Web Series";

  if (
    key === "animation" ||
    key === "animations" ||
    key === "cartoonmovies"
  ) return "Animation";

  return String(value || "Other").trim() || "Other";
}

// DISPLAY TITLE

function getDisplayTitle(movie) {
  return String(movie.title || "Untitled");
}

// POSTER MATCHING

function cleanSeriesName(title) {
  return String(title || "")
    .replace(/\.(mp4|mkv|avi|mov|webm|m4v)$/i, "")
    .replace(/[\s._-]+S\d{1,2}[\s._-]*/i, " ")
    .replace(/[\s._-]*(episode|ep)[\s._-]*\d+.*$/i, "")
    .replace(/[\s._-]*\d+x\d+.*$/i, "")
    .replace(/[\s._-]+/g, " ")
    .trim();
}

function getSeasonNumber(title) {
  const match = String(title || "")
    .match(/\bS(?:eason)?[\s._-]*(\d{1,2})\b/i);

  if (match) return String(match[1]).padStart(2, "0");

  const alternate = String(title || "")
    .match(/\bSeason[\s._-]*(\d{1,2})\b/i);

  return alternate ? String(alternate[1]).padStart(2, "0") : null;
}

function getSeasonPosterKey(movie) {
  const seriesName = cleanSeriesName(movie.title);
  const season = getSeasonNumber(movie.title);

  if (!seriesName || !season) return null;

  return (seriesName + " S" + season).toLowerCase();
}

function getSeasonPoster(movie) {
  const category = normalizeCategory(movie.category);

  if (category !== "Web Series") {
    return movie.thumbnail || "";
  }

  const key = getSeasonPosterKey(movie);

  if (!key) {
    return movie.posterThumbnail ||
      movie.poster ||
      movie.thumbnail ||
      "";
  }

  const sameSeason = allMovies.find(item =>
    normalizeCategory(item.category) === "Web Series" &&
    getSeasonPosterKey(item) === key &&
    (
      item.seasonPoster ||
      item.posterThumbnail ||
      item.poster
    )
  );

  if (sameSeason) {
    return sameSeason.seasonPoster ||
      sameSeason.posterThumbnail ||
      sameSeason.poster;
  }

  return movie.seasonPoster ||
    movie.posterThumbnail ||
    movie.poster ||
    movie.thumbnail ||
    "";
}

// CATALOGUE

function renderCatalogue(movies) {
  const catalogue = document.getElementById("catalogue");
  catalogue.innerHTML = "";

  if (!movies.length) {
    catalogue.innerHTML =
      '<div class="status">No videos found.</div>';
    return;
  }

  const categories = [...new Set([
    ...CATEGORIES,
    ...movies.map(movie => normalizeCategory(movie.category))
  ])];

  function createMovieRow(rowMovies, label) {
    if (!rowMovies.length) return null;

    const rowBlock = document.createElement("div");
    rowBlock.className = "category-row-block";

    const rowHeading = document.createElement("h3");
    rowHeading.className = "row-heading";
    rowHeading.textContent = label;

    const rowShell = document.createElement("div");
    rowShell.className = "row-shell";

    const row = document.createElement("div");
    row.className = "movie-row";

    rowMovies.forEach((movie, index) => {
      row.appendChild(createMovieCard(movie, rowMovies, index));
    });

    const leftArrow = document.createElement("button");
    leftArrow.className = "row-arrow left";
    leftArrow.type = "button";
    leftArrow.textContent = "‹";
    leftArrow.setAttribute("aria-label", "Scroll left");

    leftArrow.addEventListener("click", event => {
      event.preventDefault();
      row.scrollBy({
        left: -Math.max(220, row.clientWidth * .8),
        behavior: "smooth"
      });
    });

    const rightArrow = document.createElement("button");
    rightArrow.className = "row-arrow right";
    rightArrow.type = "button";
    rightArrow.textContent = "›";
    rightArrow.setAttribute("aria-label", "Scroll right");

    rightArrow.addEventListener("click", event => {
      event.preventDefault();
      row.scrollBy({
        left: Math.max(220, row.clientWidth * .8),
        behavior: "smooth"
      });
    });

    rowShell.append(leftArrow, row, rightArrow);
    rowBlock.append(rowHeading, rowShell);

    return rowBlock;
  }

  categories.forEach(category => {
    const categoryMovies = movies.filter(movie =>
      normalizeCategory(movie.category) === category
    );

    if (!categoryMovies.length) return;

    const section = document.createElement("section");
    section.className = "category-section";

    const heading = document.createElement("h2");
    heading.className = "category-title";
    heading.textContent = category;

    section.appendChild(heading);

    const rowLabel =
      category === "Movies" ? "All Movies" :
      category === "Web Series" ? "All Web Series" :
      category === "Animation" ? "All Animation" :
      "All " + category;

    const allRow = createMovieRow(categoryMovies, rowLabel);
    if (allRow) section.appendChild(allRow);

    catalogue.appendChild(section);
  });
}

// MOVIE CARD

function createMovieCard(movie, categoryMovies = [movie], index = 0) {
  const card = document.createElement("div");
  card.className = "movie-card";
  card.tabIndex = 0;

  const poster = document.createElement("div");
  poster.className = "poster";

  const placeholder = document.createElement("div");
  placeholder.className = "poster-placeholder";
  placeholder.textContent = getDisplayTitle(movie);
  poster.appendChild(placeholder);

  const posterUrl = getSeasonPoster(movie);

  if (posterUrl) {
    const img = document.createElement("img");
    img.src = posterUrl;
    img.alt = movie.title || "Movie poster";
    img.loading = "lazy";
    img.decoding = "async";
    img.fetchPriority = "low";
    img.onerror = () => img.remove();
    poster.appendChild(img);
  }

  const overlay = document.createElement("div");
  overlay.className = "play-overlay";

  const playIcon = document.createElement("div");
  playIcon.className = "play-icon";
  playIcon.textContent = "▶";

  overlay.appendChild(playIcon);
  poster.appendChild(overlay);

  const title = document.createElement("div");
  title.className = "movie-title";
  title.textContent = getDisplayTitle(movie);

  card.append(poster, title);

  card.addEventListener("click", () =>
    openSelection(categoryMovies, index)
  );

  card.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      openSelection(categoryMovies, index);
    }
  });

  return card;
}

function normalizeMovieTitle(title) {
  return String(title || "")
    .toLowerCase()
    .replace(/\.(mp4|mkv|avi|mov|webm|m4v)$/i, "")
    .replace(/[_\-\.\[\]\(\)]/g, " ")
    .replace(/\b(480p|720p|1080p|2160p|4k|hevc|x265|x264|web dl|webrip|bluray|hdr|esub|hindi|completed|quality)\b/gi, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function findFeaturedMovie(featuredTitle) {
  const wanted = normalizeMovieTitle(featuredTitle);

  if (!wanted) return null;

  // Exact normalized match first
  let match = allMovies.find(movie =>
    normalizeMovieTitle(movie.title) === wanted && movie.id
  );

  if (match) return match;

  // Partial matching
  // Avoid matching very short titles accidentally.
  match = allMovies.find(movie => {
    const actual = normalizeMovieTitle(movie.title);

    return movie.id &&
      wanted.length >= 4 &&
      actual.length >= 4 &&
      (actual.includes(wanted) || wanted.includes(actual));
  });

  return match || null;
}

function startHeroSlideshow() {
  const foundMovies = FEATURED_MOVIES
    .map(title => findFeaturedMovie(title))
    .filter(Boolean);

  // Remove duplicate videos
  heroMovies = foundMovies.filter((movie, index, array) =>
    array.findIndex(item => item.id === movie.id) === index
  );

  if (heroTimer) {
    clearInterval(heroTimer);
    heroTimer = null;
  }

  heroIndex = 0;

  const heroTitle = document.getElementById("heroTitle");
  const heroBackdrop = document.getElementById("heroBackdrop");
  const heroPoster = document.getElementById("heroPoster");
  const watchButton = document.getElementById("heroWatchBtn");

  if (!heroMovies.length) {
    heroTitle.textContent = "ADRASHYA INOX";
    heroBackdrop.style.backgroundImage = "none";
    heroPoster.removeAttribute("src");
    watchButton.disabled = true;
    console.warn("No featured movies matched your Drive library.");
    return;
  }

  watchButton.disabled = false;

  showHeroSlide(0);

  // Automatic slideshow every 5 seconds
  if (heroMovies.length > 1) {
    heroTimer = setInterval(() => {
      showHeroSlide((heroIndex + 1) % heroMovies.length);
    }, 5000);
  }

  console.log(
    "Hero slideshow loaded:",
    heroMovies.map(movie => movie.title)
  );

  console.log(
    "Featured titles not found:",
    FEATURED_MOVIES.filter(title => !findFeaturedMovie(title))
  );
}

function showHeroSlide(index) {
  if (!heroMovies.length) return;

  heroIndex = (index + heroMovies.length) % heroMovies.length;

  const movie = heroMovies[heroIndex];
  const image = movie.heroImage || getSeasonPoster(movie);

  const heroBackdrop = document.getElementById("heroBackdrop");
  const heroPoster = document.getElementById("heroPoster");

  document.getElementById("heroTitle").textContent =
    getDisplayTitle(movie);

  if (image) {
    const safeImage = `url("${String(image).replace(/"/g, "%22")}")`;

    // Blurred background image
    heroBackdrop.style.backgroundImage = safeImage;

    // Original poster - object-fit: contain keeps the full poster visible
    heroPoster.src = image;
    heroPoster.style.display = "block";
  } else {
    heroBackdrop.style.backgroundImage = "none";
    heroPoster.removeAttribute("src");
    heroPoster.style.display = "none";
  }
}

document.getElementById("heroWatchBtn")
  .addEventListener("click", () => {
    const movie = heroMovies[heroIndex];
    if (movie) playMovie(movie);
  });

// PREMIUM POPUP

function openSelection(list, index) {
  selectionMovies = list || [];
  selectionIndex = index || 0;

  showSelection();

  document.getElementById("selectionModal").classList.add("show");
  document.body.style.overflow = "hidden";
}

function showSelection() {
  if (!selectionMovies.length) return;

  const movie = selectionMovies[selectionIndex];
  const posterUrl = getSeasonPoster(movie);

  const poster = document.getElementById("selectionPoster");
  const hero = document.getElementById("premiumHero");

  poster.src = posterUrl || "";
  poster.style.visibility = posterUrl ? "visible" : "hidden";
  poster.alt = movie.title || "Movie poster";

  hero.style.backgroundImage = posterUrl
    ? `url("${String(posterUrl).replace(/"/g, "%22")}")`
    : "none";

  document.getElementById("selectionTitle").textContent =
    getDisplayTitle(movie);

  const description = document.getElementById("selectionDescription");
  description.textContent = movie.description || "";
  description.style.display = movie.description ? "block" : "none";

  updateMyListButton(movie);
  renderRecommendations(movie);
  renderSeriesEpisodes(movie);
}

function closeSelection() {
  document.getElementById("selectionModal").classList.remove("show");

  if (!document.getElementById("playerModal").classList.contains("show")) {
    document.body.style.overflow = "";
  }
}

document.getElementById("closeSelection")
  .addEventListener("click", closeSelection);

document.getElementById("selectionModal")
  .addEventListener("click", event => {
    if (event.target.id === "selectionModal") closeSelection();
  });

document.getElementById("selectionPlay")
  .addEventListener("click", () => {

// MY LIST

function getMyList() {
  try {
    return JSON.parse(localStorage.getItem("inoxMyList") || "[]");
  } catch (error) {
    return [];
  }
}

function isInMyList(movie) {
  return getMyList().includes(movie.id);
}

function updateMyListButton(movie) {
  const button = document.getElementById("myListButton");
  const note = document.getElementById("myListNote");
  const saved = isInMyList(movie);

  button.classList.toggle("active", saved);
  button.textContent = saved ? "✓" : "＋";
  button.title = saved ? "Remove from My List" : "Add to My List";
  note.textContent = saved ? "Added to My List" : "";
}

document.getElementById("myListButton")
  .addEventListener("click", () => {
    const movie = selectionMovies[selectionIndex];
    if (!movie || !movie.id) return;

    const list = getMyList();
    const index = list.indexOf(movie.id);

    if (index >= 0) {
      list.splice(index, 1);
    } else {
      list.push(movie.id);
    }

    localStorage.setItem("inoxMyList", JSON.stringify(list));
    updateMyListButton(movie);
  });

  const category = normalizeCategory(currentMovie.category);

  const recommendations = allMovies.filter(movie =>

// WEB SERIES SEASON / EPISODE SELECTOR

function getSeriesName(title) {
  return cleanSeriesName(title).toLowerCase();
}

function getEpisodeNumber(title) {
  const text = String(title || "");

  let match = text.match(/\bE(?:P)?[\s._-]*0*(\d{1,3})\b/i);

  if (!match) {
    match = text.match(/\bEpisode[\s._-]*0*(\d{1,3})\b/i);
  }

  if (!match) {
    match = text.match(/\b\d{1,2}x0*(\d{1,3})\b/i);
  }

  return match ? parseInt(match[1], 10) : 9999;
}

function getSeasonGroup(movie) {
  const season = getSeasonNumber(movie.title);
  return season || "01";
}

function renderSeriesEpisodes(movie) {
  const section = document.getElementById("episodeSection");
  const seasonSelect = document.getElementById("seasonSelect");
  const episodeList = document.getElementById("episodeList");

  section.classList.remove("show");
  seasonSelect.innerHTML = "";
  episodeList.innerHTML = "";

  if (normalizeCategory(movie.category) !== "Web Series") return;

  const seriesName = getSeriesName(movie.title);

  const episodes = allMovies.filter(item =>
    normalizeCategory(item.category) === "Web Series" &&
    getSeriesName(item.title) === seriesName
  );

  if (!episodes.length) return;

  const seasons = [...new Set(episodes.map(getSeasonGroup))]
    .sort((a, b) => Number(a) - Number(b));

  currentSeriesSeasons = episodes;

  seasons.forEach(season => {
    const option = document.createElement("option");
    option.value = season;
    option.textContent = "Season " + Number(season);
    seasonSelect.appendChild(option);
  });

  const selectedSeason = getSeasonGroup(movie);
  seasonSelect.value = selectedSeason;

  function renderEpisodesForSeason(season) {
    episodeList.innerHTML = "";

    const seasonEpisodes = episodes
      .filter(item => getSeasonGroup(item) === season)
      .sort((a, b) => getEpisodeNumber(a.title) - getEpisodeNumber(b.title));

    seasonEpisodes.forEach((episode, index) => {
      const item = document.createElement("div");
      item.className = "episode-item";

      const number = document.createElement("div");
      number.className = "episode-number";
      number.textContent = String(index + 1).padStart(2, "0");

      const name = document.createElement("div");
      name.className = "episode-name";
      name.textContent = getEpisodeDisplayName(episode.title);

      const play = document.createElement("div");
      play.className = "episode-play";
      play.textContent = "▶";

      item.append(number, name, play);

      item.addEventListener("click", () => {
        closeSelection();
        playMovie(episode);
      });

      episodeList.appendChild(item);
    });
  }

  seasonSelect.onchange = () => {
    renderEpisodesForSeason(seasonSelect.value);
  };

  renderEpisodesForSeason(selectedSeason);
  section.classList.add("show");
}

function getEpisodeDisplayName(title) {
  let name = String(title || "");

  name = name
    .replace(/\.(mp4|mkv|avi|mov|webm|m4v)$/i, "")
    .replace(/\bS\d{1,2}\b/ig, "")
    .replace(/\bSeason[\s._-]*\d{1,2}\b/ig, "")
    .replace(/\b(?:EP?|Episode)[\s._-]*\d{1,3}\b/ig, "")
    .replace(/\b\d{1,2}x\d{1,3}\b/ig, "")
    .replace(/\b(480p|720p|1080p|2160p|4k|HEVC|WEB-DL|BluRay|HDR|ESub)\b/ig, "")
    .replace(/[()[\]_.-]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  return name || "Episode";
}

// GOOGLE DRIVE PLAYER

function playMovie(movie) {
  if (!movie.id) {
    alert("Movie ID is missing.");
    return;
  }

  const modal = document.getElementById("playerModal");
  const playerBox = document.getElementById("playerBox");
  const message = document.getElementById("playerMessage");

  const oldFrame = document.getElementById("drivePlayer");
  if (oldFrame) oldFrame.remove();

  message.textContent = "Loading " + (movie.title || "movie") + "...";

  const iframe = document.createElement("iframe");
  iframe.id = "drivePlayer";

  iframe.src =
    "https://drive.google.com/file/d/" +
    encodeURIComponent(movie.id) +
    "/preview";

  iframe.allow = "autoplay; fullscreen";
  iframe.allowFullscreen = true;
  iframe.title = movie.title || "Movie player";

  playerBox.appendChild(iframe);

  modal.classList.add("show");
  document.body.style.overflow = "hidden";

  setTimeout(() => {
    message.textContent = "";
  }, 5000);
}

function closePlayer() {
  const modal = document.getElementById("playerModal");
  const iframe = document.getElementById("drivePlayer");

  if (iframe) iframe.remove();

  modal.classList.remove("show");
  document.body.style.overflow = "";
}

document.getElementById("closePlayer")
  .addEventListener("click", closePlayer);

document.getElementById("playerModal")
  .addEventListener("click", event => {
    if (event.target === event.currentTarget) closePlayer();
  });
