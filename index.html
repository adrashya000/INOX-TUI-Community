
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADARSHYA INOX - Unlimited Entertainment</title>

<style>
:root {
  --bg: #080808;
  --card: #181818;
  --text: #ffffff;
  --muted: #aaaaaa;
  --accent: #e50914;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 17px 5%;
  background: rgba(8,8,8,.96);
}

.logo {
  color: var(--accent);
  font-size: 27px;
  font-weight: 900;
  letter-spacing: 1px;
  white-space: nowrap;
}

.tagline {
  color: var(--muted);
  font-size: 11px;
  margin-top: 4px;
  letter-spacing: 2px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.search {
  width: 220px;
  padding: 10px 13px;
  border: 1px solid #555;
  border-radius: 5px;
  background: #171717;
  color: white;
  outline: none;
}

.search:focus {
  border-color: var(--accent);
}

.theme-btn {
  background: #333;
  border: 0;
  color: white;
  padding: 10px 13px;
  border-radius: 5px;
  cursor: pointer;
}

.hero {
  min-height: 390px;
  padding: 100px 6% 60px;
  display: flex;
  align-items: center;
  background:
    linear-gradient(90deg, #080808 5%, rgba(8,8,8,.85) 45%, rgba(8,8,8,.15)),
    linear-gradient(0deg, #080808, transparent 60%),
    radial-gradient(circle at 75% 30%, #612020, #151515 60%);
}

.hero-content {
  max-width: 600px;
}

.hero h1 {
  font-size: clamp(35px, 6vw, 65px);
  margin-bottom: 15px;
  font-weight: 900;
}

.hero p {
  color: #ddd;
  font-size: 17px;
  line-height: 1.6;
  margin-bottom: 22px;
}

.hero button {
  padding: 13px 25px;
  border: 0;
  border-radius: 4px;
  background: var(--accent);
  color: white;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

main {
  padding: 10px 0 50px;
}

.category-section {
  margin: 25px 0 35px;
}

.category-title {
  padding: 0 5%;
  font-size: 23px;
  margin-bottom: 15px;
}

.movie-row {
  display: flex;
  gap: 13px;
  overflow-x: auto;
  padding: 5px 5% 18px;
  scrollbar-width: thin;
  scrollbar-color: #555 #151515;
}

.movie-card {
  flex: 0 0 175px;
  cursor: pointer;
  transition: transform .25s;
}

.movie-card:hover {
  transform: scale(1.06);
}

.poster {
  height: 245px;
  position: relative;
  overflow: hidden;
  border-radius: 7px;
  background: #242424;
}

.poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  inset: 0;
  z-index: 1;
}

.poster-placeholder {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px;
  color: var(--muted);
  font-weight: bold;
  overflow-wrap: anywhere;
}

.play-overlay {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.25);
  opacity: 0;
  transition: opacity .2s;
}

.movie-card:hover .play-overlay {
  opacity: 1;
}

.play-icon {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
}

.movie-title {
  font-size: 14px;
  font-weight: bold;
  margin-top: 9px;
  line-height: 1.4;
}

.movie-category {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
}

.empty-message {
  color: var(--muted);
  padding: 12px 5%;
}

.status {
  text-align: center;
  padding: 30px;
  color: var(--muted);
}

/* Video player */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.96);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.show {
  display: flex;
}

.player-box {
  width: min(1100px, 100%);
  height: min(650px, 85vh);
  position: relative;
  background: #000;
  border-radius: 8px;
  overflow: hidden;
}

.player-box iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.close-btn {
  position: absolute;
  z-index: 5;
  top: 12px;
  right: 15px;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: rgba(0,0,0,.8);
  color: white;
  font-size: 25px;
  cursor: pointer;
}

.player-message {
  position: absolute;
  bottom: 10px;
  left: 10px;
  z-index: 4;
  color: white;
  font-size: 12px;
  pointer-events: none;
}

footer {
  border-top: 1px solid #292929;
  text-align: center;
  padding: 25px;
  color: #777;
  font-size: 12px;
}

body.light {
  --bg: #f2f2f2;
  --card: #ffffff;
  --text: #151515;
  --muted: #666666;
}

body.light header {
  background: rgba(245,245,245,.97);
}

body.light .search {
  background: white;
  color: black;
}

body.light .hero {
  background: linear-gradient(90deg, #222, #555);
}

body.light .hero p {
  color: white;
}

@media(max-width:600px) {
  header {
    padding: 13px 4%;
    flex-wrap: wrap;
  }

  .logo {
    font-size: 22px;
  }

  .header-right {
    width: 100%;
  }

  .search {
    flex: 1;
    width: 100%;
  }

  .hero {
    min-height: 300px;
    padding: 65px 5%;
  }

  .movie-card {
    flex-basis: 135px;
  }

  .poster {
    height: 195px;
  }

  .category-title {
    font-size: 19px;
  }

  .modal {
    padding: 5px;
  }

  .player-box {
    height: 55vh;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <div class="logo">ADARSHYA INOX</div>
    <div class="tagline">UNLIMITED ENTERTAINMENT</div>
  </div>

  <div class="header-right">
    <input
      type="search"
      id="searchBox"
      class="search"
      placeholder="Search movies..."
      autocomplete="off"
    >
    <button class="theme-btn" id="themeBtn">☀ / ☾</button>
  </div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Unlimited Entertainment</h1>
    <p>
      Discover your favourite movies, web series and animation
      in one place.
    </p>
    <button id="exploreBtn">Explore Now ▶</button>
  </div>
</section>

<main>
  <div id="catalogue">
    <div class="status">Loading your entertainment library...</div>
  </div>
</main>

<div class="modal" id="playerModal">
  <div class="player-box" id="playerBox">
    <button class="close-btn" id="closePlayer" aria-label="Close player">×</button>
    <div class="player-message" id="playerMessage"></div>
  </div>
</div>

<footer>
  ADARSHYA INOX · Unlimited Entertainment
</footer>

<script>
const API_URL =
  "https://script.google.com/macros/s/AKfycbzismKAUniBCM3f9G3kyIMaDBz7KKE0YvZE6kgQcCWCNFBruBEczDej6EiWLE8WvQeB/exec";

const CATEGORIES = ["Movies", "Web Series", "Animation"];

let allMovies = [];
let selectedMovie = null;

// Load library using JSONP
function loadMovies() {
  const callbackName = "inoxCallback";

  window[callbackName] = function(data) {
    try {
      if (data && Array.isArray(data.movies)) {
        allMovies = data.movies;
        renderCatalogue(allMovies);
      } else {
        showError("The API returned an unexpected response.");
      }
    } catch (error) {
      showError("Unable to display the movie library.");
    }

    delete window[callbackName];

    const script = document.getElementById("inoxApiScript");
    if (script) script.remove();
  };

  const oldScript = document.getElementById("inoxApiScript");
  if (oldScript) oldScript.remove();

  const script = document.createElement("script");
  script.id = "inoxApiScript";
  script.src = API_URL +
    "?callback=" + callbackName +
    "&t=" + Date.now();

  script.onerror = function() {
    showError("Unable to connect to Google Drive API. Please refresh.");
    delete window[callbackName];
    script.remove();
  };

  document.body.appendChild(script);
}

function showError(message) {
  document.getElementById("catalogue").innerHTML =
    '<div class="status">' + escapeHTML(message) + '</div>';
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char];
  });
}

function renderCatalogue(movies) {
  const catalogue = document.getElementById("catalogue");
  catalogue.innerHTML = "";

  if (!movies.length) {
    catalogue.innerHTML =
      '<div class="status">No videos found in your Google Drive folders.</div>';
    return;
  }

  CATEGORIES.forEach(category => {
    const categoryMovies = movies.filter(movie =>
      String(movie.category || "").toLowerCase() === category.toLowerCase()
    );

    if (!categoryMovies.length) return;

    const section = document.createElement("section");
    section.className = "category-section";

    const heading = document.createElement("h2");
    heading.className = "category-title";
    heading.textContent = category;

    const row = document.createElement("div");
    row.className = "movie-row";

    categoryMovies.forEach(movie => {
      row.appendChild(createMovieCard(movie));
    });

    section.appendChild(heading);
    section.appendChild(row);
    catalogue.appendChild(section);
  });

  // Show any additional categories returned by the API
  const otherCategories = [...new Set(
    movies
      .map(movie => movie.category || "Other")
      .filter(category =>
        !CATEGORIES.some(item =>
          item.toLowerCase() === String(category).toLowerCase()
        )
      )
  )];

  otherCategories.forEach(category => {
    const categoryMovies = movies.filter(movie =>
      (movie.category || "Other") === category
    );

    const section = document.createElement("section");
    section.className = "category-section";

    const heading = document.createElement("h2");
    heading.className = "category-title";
    heading.textContent = category;

    const row = document.createElement("div");
    row.className = "movie-row";

    categoryMovies.forEach(movie => {
      row.appendChild(createMovieCard(movie));
    });

    section.appendChild(heading);
    section.appendChild(row);
    catalogue.appendChild(section);
  });
}

function createMovieCard(movie) {
  const card = document.createElement("div");
  card.className = "movie-card";
  card.tabIndex = 0;

  const poster = document.createElement("div");
  poster.className = "poster";

  const placeholder = document.createElement("div");
  placeholder.className = "poster-placeholder";
  placeholder.textContent = movie.title || "Movie";
  poster.appendChild(placeholder);

  if (movie.thumbnail) {
    const img = document.createElement("img");
    img.src = movie.thumbnail;
    img.alt = movie.title || "Movie poster";
    img.loading = "lazy";

    img.onerror = function() {
      img.remove();
    };

    poster.appendChild(img);
  }

  const overlay = document.createElement("div");
  overlay.className = "play-overlay";

  const playIcon = document.createElement("div");
  playIcon.className = "play-icon";
  playIcon.textContent = "▶";

  overlay.appendChild(playIcon);
  poster.appendChild(overlay);

  const title = document.createElement("div");
  title.className = "movie-title";
  title.textContent = movie.title || "Untitled";

  const category = document.createElement("div");
  category.className = "movie-category";
  category.textContent = movie.category || "";

  card.appendChild(poster);
  card.appendChild(title);
  card.appendChild(category);

  card.addEventListener("click", () => playMovie(movie));

  card.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      playMovie(movie);
    }
  });

  return card;
}

// Google Drive embedded video player
function playMovie(movie) {
  if (!movie.id) {
    alert("Movie ID is missing.");
    return;
  }

  selectedMovie = movie;

  const modal = document.getElementById("playerModal");
  const playerBox = document.getElementById("playerBox");
  const message = document.getElementById("playerMessage");

  const oldFrame = document.getElementById("drivePlayer");
  if (oldFrame) oldFrame.remove();

  message.textContent = "Loading " + (movie.title || "movie") + "...";

  const iframe = document.createElement("iframe");
  iframe.id = "drivePlayer";
  iframe.src =
    "https://drive.google.com/file/d/" +
    encodeURIComponent(movie.id) +
    "/preview";

  iframe.allow = "autoplay; fullscreen";
  iframe.allowFullscreen = true;
  iframe.title = movie.title || "Movie player";

  playerBox.appendChild(iframe);
  modal.classList.add("show");

  document.body.style.overflow = "hidden";

  // Remove loading message after a short delay.
  // The embedded Google player controls actual playback.
  setTimeout(() => {
    message.textContent = "";
  }, 5000);
}

function closePlayer() {
  const modal = document.getElementById("playerModal");
  const iframe = document.getElementById("drivePlayer");

  if (iframe) iframe.remove();

  modal.classList.remove("show");
  document.body.style.overflow = "";
  selectedMovie = null;
}

document.getElementById("closePlayer")
  .addEventListener("click", closePlayer);

document.getElementById("playerModal")
  .addEventListener("click", function(event) {
    if (event.target === this) closePlayer();
  });

document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") closePlayer();
});

// Search all categories
document.getElementById("searchBox")
  .addEventListener("input", function() {
    const query = this.value.trim().toLowerCase();

    const filtered = allMovies.filter(movie =>
      String(movie.title || "").toLowerCase().includes(query)
    );

    renderCatalogue(filtered);
  });

// Theme toggle
document.getElementById("themeBtn")
  .addEventListener("click", function() {
    document.body.classList.toggle("light");
  });

// Explore button
document.getElementById("exploreBtn")
  .addEventListener("click", function() {
    document.getElementById("catalogue")
      .scrollIntoView({ behavior: "smooth" });
  });

// Start
loadMovies();
</script>

</body>
</html>
