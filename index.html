
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADRASHYA INOX | Unlimited Entertainment</title>

<style>
:root {
  --bg: #080808;
  --text: #fff;
  --muted: #aaa;
  --accent: #e50914;
  --card: #181818;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 17px 5%;
  background: rgba(8,8,8,.96);
}

.logo {
  color: var(--accent);
  font-size: 27px;
  font-weight: 900;
  letter-spacing: 1px;
  text-decoration: none;
}

.tagline {
  color: var(--muted);
  font-size: 11px;
  margin-top: 4px;
  letter-spacing: 2px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* CATEGORY NAVIGATION - centered between brand and search */
.header-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(10px, 1.7vw, 25px);
  flex: 1;
  min-width: 0;
  white-space: nowrap;
}

.nav-link {
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 9px 2px 7px;
  background: transparent;
  color: #c9c9c9;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: color .2s, border-color .2s;
}

.nav-link:hover,
.nav-link.active {
  color: #fff;
  border-bottom-color: var(--accent);
}

body.light .nav-link { color: #555; }
body.light .nav-link:hover,
body.light .nav-link.active { color: #111; }

.search {
  width: 220px;
  padding: 10px 13px;
  border: 1px solid #555;
  border-radius: 5px;
  background: #171717;
  color: white;
  outline: none;
}

.search:focus {
  border-color: var(--accent);
}

.theme-btn {
  background: #333;
  border: 0;
  color: white;
  padding: 10px 13px;
  border-radius: 5px;
  cursor: pointer;
}

/* HERO SLIDESHOW */

.hero {
  height: 430px;
  min-height: 430px;
  padding: 25px 7%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background-color: #101010;
}

.hero-backdrop {
  position: absolute;
  inset: -25px;
  z-index: 0;
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  filter: blur(12px);
  transform: scale(1.08);
  opacity: .65;
  transition: opacity .5s ease;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  background:
    linear-gradient(90deg,
      rgba(0,0,0,.72),
      rgba(0,0,0,.12),
      rgba(0,0,0,.55)),
    linear-gradient(0deg,
      rgba(0,0,0,.65),
      rgba(0,0,0,.08));
}

.hero-poster-wrap {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  padding: 0;
}

.hero-poster {
  display: block;
  width: 100%;
  height: 100%;
  max-width: none;
  object-fit: cover;
  object-position: center;
  border-radius: 0;
  box-shadow: none;
  opacity: 1;
  transition: opacity .35s ease-in-out;
}

.hero-content {
  width: 100%;
  max-width: 750px;
  position: absolute;
  z-index: 3;
  left: 5%;
  bottom: 30px;
  pointer-events: none;
}

.hero h1 {
  font-size: clamp(22px,3vw,34px);
  font-weight: 800;
  line-height: 1.2;
  max-width: 400px;
  overflow-wrap: anywhere;
  text-shadow: 0 3px 12px rgba(0,0,0,.95);
}

.hero-watch-btn {
  margin-top: 12px;
  border: 0;
  border-radius: 5px;
  padding: 11px 20px;
  background: var(--accent);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  pointer-events: auto;
  position: relative;
  z-index: 5;
}

.hero-watch-btn:hover,
.premium-play:hover {
  background: #b80710;
}

.hero-watch-btn:disabled {
  opacity: .55;
  cursor: not-allowed;
}

/* CATALOGUE */

/* CATEGORY PAGE: show every title together in a poster grid (no horizontal row) */
.category-page-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
  gap: 25px 17px;
  padding: 8px 5% 28px;
}
.category-page-grid .movie-card {
  width: 100%;
  min-width: 0;
  flex: initial;
}
.category-page-grid .poster {
  height: auto;
  aspect-ratio: 2 / 3;
}
.category-page-grid .movie-title { font-size: 16px; }

/* More readable typography */
.nav-link { font-size: 16px; }
.search { font-size: 15px; }
.category-title { font-size: 27px; }
.row-heading { font-size: 17px; }
.movie-title { font-size: 16px; }
.premium-section-title { font-size: 22px; }
.recommendation-title { font-size: 15px; }
.episode-header h3 { font-size: 21px; }
.episode-name { font-size: 15px; }

.episode-selectors { display:flex; gap:10px; flex-wrap:wrap; }
.episode-select { min-width:180px; cursor:pointer; font-size:15px; min-height:42px; }

@keyframes heroTitleReveal {
  from { opacity:0; transform:translateY(18px); filter:blur(5px); }
  to { opacity:1; transform:translateY(0); filter:blur(0); }
}
.hero h1.title-enter { animation:heroTitleReveal .65s ease both; }


main {
  padding: 10px 0 50px;
}

.category-section {
  margin: 25px 0 35px;
  content-visibility: auto;
  contain-intrinsic-size: auto 360px;
}

.category-title {
  padding: 0 5%;
  font-size: 23px;
  margin-bottom: 15px;
}

.category-row-block {
  width: 100%;
  margin-bottom: 10px;
}

.row-heading {
  padding: 0 5%;
  margin: 4px 0 8px;
  color: var(--muted);
  font-size: 15px;
  font-weight: 700;
}

.recently-added-heading {
  color: var(--text);
  font-size: 20px;
}

.recently-added-heading::after {
  content: "  NEW";
  display: inline-block;
  margin-left: 7px;
  padding: 3px 6px;
  border-radius: 3px;
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  vertical-align: 3px;
  letter-spacing: .5px;
}

.row-shell {
  position: relative;
  width: 100%;
  overflow: hidden;
}

.movie-row {
  display: flex;
  gap: 13px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 5px 5% 18px;
  scrollbar-width: none;
  -ms-overflow-style: none;
  scroll-behavior: smooth;
  scroll-snap-type: x proximity;
  -webkit-overflow-scrolling: touch;
}

.movie-row::-webkit-scrollbar,
.recommendation-row::-webkit-scrollbar {
  display: none;
}

.row-arrow {
  position: absolute;
  z-index: 4;
  top: 38%;
  width: 38px;
  height: 62px;
  border: 0;
  border-radius: 5px;
  background: rgba(0,0,0,.78);
  color: white;
  font-size: 26px;
  cursor: pointer;
  opacity: 0;
  transition: opacity .2s;
}

.row-shell:hover .row-arrow,
.row-arrow:focus {
  opacity: 1;
}

.row-arrow.left { left: 5px; }
.row-arrow.right { right: 5px; }

.movie-card {
  flex: 0 0 175px;
  cursor: pointer;
  transition: transform .25s;
  scroll-snap-align: start;
}

.movie-card:hover {
  transform: scale(1.06);
}

.poster {
  height: 245px;
  position: relative;
  overflow: hidden;
  border-radius: 7px;
  background: #242424;
}

.poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  inset: 0;
  z-index: 1;
}

.poster-placeholder {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px;
  color: var(--muted);
  font-weight: bold;
  overflow-wrap: anywhere;
}

.play-overlay {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.25);
  opacity: 0;
  transition: opacity .2s;
}

.movie-card:hover .play-overlay {
  opacity: 1;
}

.play-icon {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
}

.movie-title {
  font-size: 14px;
  font-weight: bold;
  margin-top: 9px;
  line-height: 1.4;
}

.status {
  text-align: center;
  padding: 30px;
  color: var(--muted);
}

/* CINEMATIC PREMIUM POPUP */

.selection-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 90;
  padding: 25px;
  background: rgba(0,0,0,.88);
  backdrop-filter: blur(9px);
  align-items: center;
  justify-content: center;
}

.selection-modal.show {
  display: flex;
  animation: modalFade .25s ease;
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
}

.selection-modal {
  z-index: 99999;
  pointer-events: none;
}

.selection-modal.show {
  pointer-events: auto;
}

.selection-modal .premium-box,
.selection-modal .premium-box * {
  pointer-events: auto;
}

@keyframes modalFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.premium-box {
  width: min(1000px, 100%);
  max-height: 92vh;
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
  background: #111;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 15px;
  box-shadow: 0 25px 90px rgba(0,0,0,.8);
  scrollbar-width: thin;
  scrollbar-color: #555 #111;
}

.premium-hero {
  min-height: 430px;
  position: relative;
  display: flex;
  align-items: flex-end;
  padding: 45px;
  background-color: #191919;
  background-size: cover;
  background-position: center;
  isolation: isolate;
}

.premium-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(90deg,rgba(0,0,0,.95) 0%,rgba(0,0,0,.65) 48%,rgba(0,0,0,.15) 100%),
    linear-gradient(0deg,#111 0%,rgba(0,0,0,.15) 75%);
}

.premium-close {
  position: absolute;
  z-index: 5;
  top: 15px;
  right: 17px;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: rgba(0,0,0,.72);
  color: white;
  font-size: 27px;
  cursor: pointer;
  transition: background .2s, transform .2s;
}

.premium-close:hover {
  background: var(--accent);
  transform: rotate(90deg);
}

.premium-content {
  display: flex;
  align-items: flex-end;
  gap: 30px;
  width: 100%;
  position: relative;
  z-index: 2;
}

.premium-poster-wrap {
  flex: 0 0 195px;
}

.premium-poster {
  width: 195px;
  height: 280px;
  display: block;
  object-fit: cover;
  border-radius: 9px;
  background: #252525;
  box-shadow: 0 12px 35px rgba(0,0,0,.65);
}

.premium-info {
  flex: 1;
  min-width: 0;
  padding-bottom: 8px;
}

.premium-title {
  font-size: clamp(26px,4vw,42px);
  line-height: 1.15;
  font-weight: 900;
  overflow-wrap: anywhere;
  text-shadow: 0 3px 15px rgba(0,0,0,.8);
}

.premium-description {
  display: none;
  margin-top: 14px;
  color: #ddd;
  font-size: 14px;
  line-height: 1.6;
}

.premium-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 23px;
}

.premium-play {
  border: 0;
  border-radius: 5px;
  background: var(--accent);
  color: white;
  padding: 13px 25px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: background .2s, transform .2s;
}

.premium-play:hover {
  transform: translateY(-2px);
}

.premium-list {
  width: 47px;
  height: 45px;
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 5px;
  background: rgba(35,35,35,.8);
  color: white;
  font-size: 25px;
  cursor: pointer;
  transition: background .2s;
}

.premium-list:hover,
.premium-list.active {
  background: #444;
  border-color: white;
}

.premium-list-note {
  font-size: 12px;
  color: #aaa;
  margin-top: 9px;
  min-height: 15px;
}

/* MORE LIKE THIS */

.premium-recommendations {
  padding: 20px 30px 30px;
}

.premium-section-title {
  font-size: 19px;
  font-weight: 800;
  margin-bottom: 16px;
}

.recommendation-row {
  display: flex;
  gap: 13px;
  overflow-x: auto;
  padding: 4px 3px 12px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.recommendation-card {
  flex: 0 0 145px;
  cursor: pointer;
  transition: transform .2s;
}

.recommendation-card:hover {
  transform: translateY(-4px);
}

.recommendation-poster {
  width: 100%;
  height: 195px;
  object-fit: cover;
  display: block;
  border-radius: 7px;
  background: #242424;
}

.recommendation-title {
  margin-top: 8px;
  font-size: 13px;
  font-weight: bold;
  line-height: 1.4;
}

/* WEB SERIES EPISODES */

.episode-section {
  display: none;
  padding: 0 30px 25px;
}

.episode-section.show {
  display: block;
}

.episode-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 16px;
}

.episode-header h3 {
  font-size: 19px;
}

.season-select {
  background: #252525;
  color: white;
  border: 1px solid #555;
  border-radius: 5px;
  padding: 9px 12px;
  max-width: 180px;
  outline: none;
}

.episode-list {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 10px;
}

.episode-item.active { outline: 2px solid var(--accent, #7c5cff); background: rgba(124,92,255,.12); }
.episode-item {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  padding: 10px;
  border-radius: 7px;
  background: #202020;
  cursor: pointer;
  transition: background .2s;
}

.episode-item:hover {
  background: #333;
}

.episode-number {
  color: #aaa;
  font-size: 18px;
  font-weight: bold;
  min-width: 27px;
}

.episode-name {
  flex: 1;
  min-width: 0;
  font-size: 13px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.episode-play {
  color: white;
  background: var(--accent);
  border-radius: 50%;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* VIDEO PLAYER */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.96);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.show {
  display: flex;
}

.player-box {
  width: min(1100px,100%);
  height: min(650px,85vh);
  position: relative;
  background: #000;
  border-radius: 8px;
  overflow: hidden;
}

.player-box iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.close-btn {
  position: absolute;
  z-index: 5;
  top: 12px;
  right: 15px;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: rgba(0,0,0,.8);
  color: white;
  font-size: 25px;
  cursor: pointer;
}

.player-message {
  position: absolute;
  bottom: 10px;
  left: 10px;
  z-index: 4;
  color: white;
  font-size: 12px;
  pointer-events: none;
}

footer {
  border-top: 1px solid #292929;
  text-align: center;
  padding: 25px;
  color: #777;
  font-size: 12px;
}

/* LIGHT MODE */

body.light {
  --bg: #f2f2f2;
  --text: #151515;
  --muted: #666;
}

body.light header {
  background: rgba(245,245,245,.97);
}

body.light .search {
  background: white;
  color: black;
}

body.light .hero {
  background-color: #333;
}

/* MOBILE */

@media(max-width:650px) {
  header {
    padding: 13px 4%;
    flex-wrap: wrap;
  }

  .logo {
    font-size: 22px;
  }

  .header-nav {
    order: 2;
    width: 100%;
    flex: 0 0 100%;
    justify-content: space-between;
    gap: 8px;
    overflow-x: auto;
    padding: 0 1px 3px;
  }

  .nav-link {
    font-size: 12px;
    flex: 0 0 auto;
  }

  .header-right {
    order: 3;
    width: 100%;
  }

  .search {
    flex: 1;
    width: 100%;
  }

  .hero {
    height: 270px;
    min-height: 270px;
    padding: 15px 5%;
  }

  .hero-backdrop {
    inset: -18px;
    filter: blur(10px);
  }

  .hero-poster-wrap {
    padding: 0;
  }

  .hero-poster {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .hero-content {
    left: 5%;
    bottom: 13px;
  }

  .hero h1 {
    font-size: clamp(17px,5vw,23px);
    max-width: 65%;
  }

  .hero-watch-btn {
    margin-top: 8px;
    padding: 9px 14px;
    font-size: 12px;
  }

  .row-arrow {
    opacity: .85;
    width: 30px;
    height: 48px;
  }

  .movie-card {
    flex-basis: 135px;
  }

  .poster {
    height: 195px;
  }

  .category-title {
    font-size: 22px;
  }

  .category-page-grid {
    grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
    gap: 19px 11px;
    padding-left: 4%;
    padding-right: 4%;
  }
  .category-page-grid .movie-title { font-size: 14px; }
  .nav-link { font-size: 13px; }
  .episode-selectors { width:100%; }
  .episode-select { min-width:0; flex:1 1 100%; width:100%; }

  .selection-modal {
    padding: 8px;
  }

  .premium-box {
    max-height: 94vh;
    border-radius: 11px;
  }

  .premium-hero {
    min-height: 520px;
    padding: 25px 18px;
    background-position: center;
  }

  .premium-hero::before {
    background:
      linear-gradient(0deg,#111 0%,rgba(0,0,0,.65) 50%,rgba(0,0,0,.25) 100%),
      linear-gradient(90deg,rgba(0,0,0,.35),transparent);
  }

  .premium-content {
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 17px;
  }

  .premium-poster-wrap {
    flex: none;
  }

  .premium-poster {
    width: 145px;
    height: 205px;
  }

  .premium-title {
    font-size: 25px;
  }

  .premium-actions {
    justify-content: center;
    margin-top: 17px;
  }

  .premium-recommendations {
    padding: 18px 15px 25px;
  }

  .recommendation-card {
    flex-basis: 115px;
  }

  .recommendation-poster {
    height: 155px;
  }

  .episode-section {
    padding: 0 15px 22px;
  }

  .episode-list {
    grid-template-columns: 1fr;
  }

  .episode-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .season-select {
    max-width: 100%;
    width: 100%;
  }

  .modal {
    padding: 5px;
  }

  .player-box {
    height: 55vh;
  }
}


/* =========================================================
   ADRASHYA INOX — iOS / Apple TV inspired visual refresh
   Keeps the existing Google Drive catalogue and playback JS.
   ========================================================= */
:root {
  color-scheme: dark;
  --bg: #08090d;
  --text: #f5f5f7;
  --muted: #a1a1aa;
  --accent: #0a84ff;
  --card: #17191f;
  --surface: rgba(30,32,39,.82);
  --surface-border: rgba(255,255,255,.09);
  --header-bg: rgba(10,11,15,.78);
  --soft-shadow: 0 18px 55px rgba(0,0,0,.28);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  letter-spacing: -.015em;
  transition: background .28s ease, color .28s ease;
}
header {
  padding: 14px clamp(18px,4.5vw,68px);
  gap: 22px;
  background: var(--header-bg);
  border-bottom: 1px solid var(--surface-border);
  backdrop-filter: saturate(180%) blur(24px);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
}

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbzismKAUniBCM3f9G3kyIMaDBz7KKE0YvZE6kgQcCWCNFBruBEczDej6EiWLE8WvQeB/exec";

const CATEGORIES = ["Movies", "Web Series", "Animation"];

let allMovies = [];
let activeCategory = "Home";
let heroImages = [];
let heroIndex = 0;
let heroTimer = null;
let currentHeroMovie = null;
let heroRequestToken = 0;

let selectionMovies = [];
let selectionIndex = 0;
let currentSeriesSeasons = [];
let currentSelectedVideo = null;

// IMAGE URL OPTIMIZATION

function optimizeDriveImageUrl(url, size) {
  if (!url) return "";

  const value = String(url);

  if (!/drive\.google\.com\/thumbnail/i.test(value)) {
    return value;
  }

  if (/[?&]sz=/i.test(value)) {
    return value.replace(
      /([?&]sz=)w?\d+/i,
      "$1w" + size
    );
  }

  return value +
    (value.includes("?") ? "&" : "?") +
    "sz=w" + size;
}

// LOAD GOOGLE DRIVE LIBRARY

const MOVIE_CACHE_KEY = "adrashyaInoxMovieCache_v7";
const MOVIE_CACHE_TTL = 5 * 60 * 1000;
let apiRequestInProgress = false;

function readMovieCache() {
  try {
    const saved = localStorage.getItem(MOVIE_CACHE_KEY);
    if (!saved) return null;

    const cache = JSON.parse(saved);

    if (
      !cache ||
      !Array.isArray(cache.movies) ||
      !Array.isArray(cache.heroImages) ||
      !cache.savedAt
    ) return null;

    return cache;
  } catch (error) {
    console.warn("Movie cache could not be read:", error);
    return null;
  }
}

function saveMovieCache(movies, images) {
  try {
    localStorage.setItem(MOVIE_CACHE_KEY, JSON.stringify({
      savedAt: Date.now(),
      movies: movies,
      heroImages: images
    }));
  } catch (error) {
    console.warn("Movie cache could not be saved:", error);
  }
}

function displayMovies(movies, images) {
  allMovies = movies;
  heroImages = Array.isArray(images) ? images : [];

  renderCatalogue(allMovies);
  startHeroSlideshow();
}

function loadMovies() {
  const cache = readMovieCache();

  const cacheIsFresh = cache &&
    (Date.now() - cache.savedAt) < MOVIE_CACHE_TTL;

  if (cache && cache.movies.length) {
    displayMovies(cache.movies, cache.heroImages);
  }

  if (cacheIsFresh) return;

  if (apiRequestInProgress) return;
  apiRequestInProgress = true;

  const callbackName = "inoxCallback";
  let requestFinished = false;
  let requestTimeout;

  function finishRequest() {
    if (requestFinished) return;

    requestFinished = true;
    apiRequestInProgress = false;
    delete window[callbackName];

    if (requestTimeout) {
      clearTimeout(requestTimeout);
    }

    const oldScript = document.getElementById("inoxApiScript");
    if (oldScript) oldScript.remove();
  }

  window[callbackName] = function(data) {
    if (
      data &&
      Array.isArray(data.movies) &&
      Array.isArray(data.heroImages)
    ) {
      saveMovieCache(data.movies, data.heroImages);
      displayMovies(data.movies, data.heroImages);
    } else if (!cache || !cache.movies.length) {
      showError("Unexpected API response.");
      console.error("Unexpected API response:", data);
    }

    finishRequest();
  };

  const script = document.createElement("script");
  script.id = "inoxApiScript";
  script.src = API_URL +
    "?callback=" + callbackName +
    "&t=" + Date.now();

  script.onerror = function() {
    if (!cache || !cache.movies.length) {
      showError("Unable to connect to Google Drive API.");
    }
    finishRequest();
  };

  requestTimeout = window.setTimeout(function() {
    if (!requestFinished) {
      if (!cache || !cache.movies.length) {
        showError("Google Drive is taking too long to respond. Please reload.");
      }
      finishRequest();
    }
  }, 15000);

  document.body.appendChild(script);
}

function showError(message) {
  document.getElementById("catalogue").textContent = message;
}

/* CATEGORY NORMALIZATION */

function normalizeCategory(value) {
  const key = String(value || "")
    .trim()
    .toLowerCase()
    .replace(/[\s_-]+/g, "");

  if (key === "movie" || key === "movies") return "Movies";
  if (key === "webseries" || key === "series") return "Web Series";

  if (
    key === "animation" ||
    key === "animations" ||
    key === "cartoonmovies"
  ) return "Animation";

  return String(value || "Other").trim() || "Other";
}

// DISPLAY TITLE

function getDisplayTitle(movie) {
  return String(movie.title || "Untitled");
}

// POSTER MATCHING

function cleanSeriesName(title) {
  return String(title || "")
    .replace(/\.(mp4|mkv|avi|mov|webm|m4v)$/i, "")
    .replace(/[\s._-]+S\d{1,2}[\s._-]*/i, " ")
    .replace(/[\s._-]*(episode|ep)[\s._-]*\d+.*$/i, "")
    .replace(/[\s._-]*\d+x\d+.*$/i, "")
    .replace(/[\s._-]+/g, " ")
    .trim();
}

function getSeasonNumber(title) {
  const text = String(title || '').replace(/[._-]+/g, ' ');
  // Supports S01E01, S01 (E-01), S01 E 01, Season 1 Episode 1,
  // and complete-season names such as "Gullak Season 1 (2020)".
  let match = text.match(/\bS(?:eason)?\s*0*(\d{1,2})\s*(?:\(\s*)?E\s*0*\d{1,3}\s*\)?/i);
  if (!match) match = text.match(/\bSeason\s*0*(\d{1,2})\b/i);
  if (!match) match = text.match(/\bS\s*0*(\d{1,2})\b/i);
  if (!match) match = text.match(/\b(\d{1,2})\s*[xX]\s*0*\d{1,3}\b/);
  return match ? String(match[1]).padStart(2, '0') : null;
}

function getSeasonPosterKey(movie) {
  const seriesName = cleanSeriesName(movie.title);
  const season = getSeasonNumber(movie.title);

  if (!seriesName || !season) return null;

  return (seriesName + " S" + season).toLowerCase();
}

function getSeasonPoster(movie) {
  const category = normalizeCategory(movie.category);

  if (category !== "Web Series") {
    return movie.thumbnail || "";
  }

  const key = getSeasonPosterKey(movie);

  if (!key) {
    return movie.posterThumbnail ||
      movie.poster ||
      movie.thumbnail ||
      "";
  }

  const sameSeason = allMovies.find(item =>
    normalizeCategory(item.category) === "Web Series" &&
    getSeasonPosterKey(item) === key &&
    (
      item.seasonPoster ||
      item.posterThumbnail ||
      item.poster
    )
  );

  if (sameSeason) {
    return sameSeason.seasonPoster ||
      sameSeason.posterThumbnail ||
      sameSeason.poster;
  }

  return movie.seasonPoster ||
    movie.posterThumbnail ||
    movie.poster ||
    movie.thumbnail ||
    "";
}

// CATALOGUE

function renderCatalogue(movies) {
  const catalogue = document.getElementById("catalogue");
  catalogue.innerHTML = "";

  const query = document.getElementById("searchBox").value.trim().toLowerCase();
  let visibleMovies = (movies || []).filter(movie =>
    String(movie.title || "").toLowerCase().includes(query)
  );

  if (activeCategory === "Favourite") {
    const savedIds = new Set(getMyList().map(id => String(id)));
    visibleMovies = visibleMovies.filter(movie => savedIds.has(String(movie.id)));
  } else if (activeCategory !== "Home") {
    visibleMovies = visibleMovies.filter(movie =>
      normalizeCategory(movie.category) === activeCategory
    );
  }

  if (!visibleMovies.length) {
    catalogue.innerHTML =
      '<div class="status">No videos found.</div>';
    return;
  }

  const categories = activeCategory === "Home"
    ? [...new Set([
        ...CATEGORIES,
        ...visibleMovies.map(movie => normalizeCategory(movie.category))
      ])]
    : activeCategory === "Favourite"
      ? ["Favourite"]
      : [activeCategory];

  movies = visibleMovies;

  function createMovieRow(rowMovies, label) {
    if (!rowMovies.length) return null;

    const rowBlock = document.createElement("div");
    rowBlock.className = "category-row-block";

    const rowHeading = document.createElement("h3");
    rowHeading.className = "row-heading";
    if (label === "Recently Added") {
      rowHeading.classList.add("recently-added-heading");
    }
    rowHeading.textContent = label;

    const rowShell = document.createElement("div");
    rowShell.className = "row-shell";

    const row = document.createElement("div");
    row.className = "movie-row";

    rowMovies.forEach((movie, index) => {
      row.appendChild(createMovieCard(movie, rowMovies, index));
    });

    const leftArrow = document.createElement("button");
    leftArrow.className = "row-arrow left";
    leftArrow.type = "button";
    leftArrow.textContent = "‹";
    leftArrow.setAttribute("aria-label", "Scroll left");

    leftArrow.addEventListener("click", event => {
      event.preventDefault();
      row.scrollBy({
        left: -Math.max(220, row.clientWidth * .8),
        behavior: "smooth"
      });
    });

    const rightArrow = document.createElement("button");
    rightArrow.className = "row-arrow right";
    rightArrow.type = "button";
    rightArrow.textContent = "›";
    rightArrow.setAttribute("aria-label", "Scroll right");

    rightArrow.addEventListener("click", event => {
      event.preventDefault();
      row.scrollBy({
        left: Math.max(220, row.clientWidth * .8),
        behavior: "smooth"
      });
    });

    rowShell.append(leftArrow, row, rightArrow);
    rowBlock.append(rowHeading, rowShell);

    return rowBlock;
  }

  // One common row: newest Drive uploads across all categories.
  // createdTime is supplied by Google Apps Script in milliseconds.
  const recentlyAdded = [...movies]
    .sort((a, b) => Number(b.createdTime || 0) - Number(a.createdTime || 0))
    .slice(0, 19);

  if (activeCategory === "Home" && !query) {
    const recentlyAddedRow = createMovieRow(recentlyAdded, "Recently Added");
    if (recentlyAddedRow) catalogue.appendChild(recentlyAddedRow);
  }

  categories.forEach(category => {
    const categoryMovies = category === "Favourite"
      ? movies
      : movies.filter(movie => normalizeCategory(movie.category) === category);

    if (!categoryMovies.length) return;

    const section = document.createElement("section");
    section.className = "category-section";

    const heading = document.createElement("h2");
    heading.className = "category-title";
    heading.textContent = category;

    section.appendChild(heading);

    const rowLabel =
      category === "Favourite" ? "Your Favourite Videos" :
      category === "Movies" ? "All Movies" :
      category === "Web Series" ? "All Web Series" :
      category === "Animation" ? "All Animation" :
      "All " + category;

    if (activeCategory !== "Home") {
      const grid = document.createElement("div");
      grid.className = "category-page-grid";
      categoryMovies.forEach((movie, index) => {
        grid.appendChild(createMovieCard(movie, categoryMovies, index));
      });
      section.appendChild(grid);
    } else {
      const allRow = createMovieRow(categoryMovies, rowLabel);
      if (allRow) section.appendChild(allRow);
    }

    catalogue.appendChild(section);
  });
}

function createMovieCard(movie, categoryMovies = [movie], index = 0) {

  card.className = "movie-card";

// HERO SLIDESHOW - IMPROVED MATCHING AND LOADING

const HERO_SLIDE_DURATION = 6000;

function normalizeHeroName(name) {
  return String(name || "")
    .replace(/\.(jpg|jpeg|png|webp|gif|bmp)$/i, "")
    .replace(/\.(mp4|mkv|avi|mov|webm|m4v)$/i, "")
    .replace(/\b(480p|720p|1080p|2160p|4k|8k|hevc|h264|h265|web.?dl|webrip|bluray|hdr|x264|x265)\b/gi, " ")
    .replace(/\b(19|20)\d{2,3}\b/g, " ")
    .replace(/\b(poster|hero|banner|official|movie|series)\b/gi, " ")
    .replace(/\bS(?:eason)?[\s._-]*\d{1,2}\b/gi, " ")
    .replace(/\b(?:EP?|Episode)[\s._-]*\d{1,3}\b/gi, " ")
    .replace(/\b\d{1,2}x\d{1,3}\b/gi, " ")
    .replace(/[\[\](){}]/g, " ")
    .replace(/[_\-.]+/g, " ")
    .replace(/[^a-zA-Z0-9\s]/g, " ")
    .toLowerCase()
    .replace(/\s+/g, " ")
    .trim();
}

function getHeroMovieNames(movie) {
  const names = [
    movie.title,
    movie.name,
    movie.fileName,
    movie.filename,
    movie.originalName
  ].filter(Boolean);

  if (normalizeCategory(movie.category) === "Web Series") {
    names.push(cleanSeriesName(movie.title));
  }

  return [...new Set(names.map(normalizeHeroName).filter(Boolean))];
}

function findHeroMovie(image) {
  const heroName = normalizeHeroName(image.name);

  if (!heroName) return null;

  const heroTokens = heroName.split(" ").filter(Boolean);

  let bestMovie = null;
  let bestScore = 0;
  let secondScore = 0;

  allMovies.forEach(movie => {
    const names = getHeroMovieNames(movie);
    let movieBestScore = 0;

    names.forEach(movieName => {
      const movieTokens = movieName.split(" ").filter(Boolean);

      if (!movieName) return;

      // Exact match
      if (movieName === heroName) {
        movieBestScore = Math.max(movieBestScore, 100);
        return;
      }

      // Full title inside Hero filename
      if (movieName.length >= 4 && heroName.includes(movieName)) {
        movieBestScore = Math.max(movieBestScore, 95);
        return;
      }

      // Hero filename inside movie title
      if (heroName.length >= 4 && movieName.includes(heroName)) {
        movieBestScore = Math.max(movieBestScore, 90);
        return;
      }

      // Compare individual words
      const matchingTokens = heroTokens.filter(token =>
        movieTokens.includes(token)
      );

      const uniqueMatchingTokens = [...new Set(matchingTokens)];

      if (!uniqueMatchingTokens.length) return;

      const unionTokens = new Set([
        ...heroTokens,
        ...movieTokens
      ]);

      const jaccard =
        uniqueMatchingTokens.length / Math.max(1, unionTokens.size);

      const hasLongMatch = uniqueMatchingTokens.some(token =>
        token.length >= 6
      );

      // Require a meaningful match, not just a common short word
      if (
        uniqueMatchingTokens.length >= 2 ||
        (uniqueMatchingTokens.length === 1 && hasLongMatch)
      ) {
        movieBestScore = Math.max(
          movieBestScore,
          jaccard * 85
        );
      }
    });

    if (movieBestScore > bestScore) {
      secondScore = bestScore;
      bestScore = movieBestScore;
      bestMovie = movie;
    } else if (movieBestScore > secondScore) {
      secondScore = movieBestScore;
    }
  });

  // A confident match is required to avoid playing the wrong movie
  if (
    !bestMovie ||
    bestScore < 45 ||
    (bestScore - secondScore < 10 && bestScore < 90)
  ) {
    console.warn(
      "Hero image could not be matched:",
      image.name,
      "Best score:",
      bestScore,
      "Second score:",
      secondScore
    );

    return null;
  }

  console.log(
    "Hero match:",
    image.name,
    "=>",
    bestMovie.title
  );

  return bestMovie;
}

function startHeroSlideshow() {
  if (heroTimer) {
    clearInterval(heroTimer);
    heroTimer = null;
  }

  heroIndex = 0;
  currentHeroMovie = null;
  heroRequestToken++;

  const heroTitle = document.getElementById("heroTitle");
  const heroPoster = document.getElementById("heroPoster");
  heroPoster.loading = "eager";
  heroPoster.decoding = "async";
  heroPoster.fetchPriority = "high";
  const heroBackdrop = document.getElementById("heroBackdrop");
  const watchButton = document.getElementById("heroWatchBtn");

  watchButton.style.display = "none";

  if (!heroImages.length) {
    heroTitle.textContent = "ADRASHYA INOX";
    heroPoster.removeAttribute("src");
    heroBackdrop.style.backgroundImage = "none";

    console.warn("No images found in the Hero folder.");
    return;
  }

  showHeroSlide(0);

  if (heroImages.length > 1) {
    heroTimer = setInterval(() => {
      showHeroSlide((heroIndex + 1) % heroImages.length);
    }, HERO_SLIDE_DURATION);
  }

  console.log(
    "Hero slideshow loaded:",
    heroImages.length,
    "images"
  );

  console.log(
    "Hero image names:",
    heroImages.map(image => image.name)
  );
}

function showHeroSlide(index) {
  if (!heroImages.length) return;

  heroIndex = (index + heroImages.length) % heroImages.length;

  const image = heroImages[heroIndex];

  if (!image || !image.url) return;

  const heroPoster = document.getElementById("heroPoster");
  const heroBackdrop = document.getElementById("heroBackdrop");
  const heroTitle = document.getElementById("heroTitle");
  const watchButton = document.getElementById("heroWatchBtn");

  const requestToken = ++heroRequestToken;

  currentHeroMovie = findHeroMovie(image);

  if (currentHeroMovie) {
    heroTitle.textContent = getDisplayTitle(currentHeroMovie);
    watchButton.style.display = "inline-block";
    watchButton.disabled = false;
  } else {
    heroTitle.textContent = String(image.name || "Featured Movie")
      .replace(/\.(jpg|jpeg|png|webp|gif|bmp)$/i, "")
      .replace(/[_\-.]+/g, " ")
      .trim();

    watchButton.style.display = "none";
  }

  heroTitle.classList.remove("title-enter");
  void heroTitle.offsetWidth;
  heroTitle.classList.add("title-enter");

  const imageUrl = optimizeDriveImageUrl(image.url, 1100);

  // Load the image only once through the visible image element
  heroPoster.style.opacity = "0";

  heroPoster.onload = function() {
    if (requestToken !== heroRequestToken) return;

    heroPoster.style.opacity = "1";
  };

  heroPoster.onerror = function() {
    if (requestToken !== heroRequestToken) return;

    console.warn("Hero image failed to load:", image.name);
    heroPoster.style.opacity = "1";
  };

  // Same URL is reused for the background and browser cache
  heroBackdrop.style.backgroundImage =
    `url("${imageUrl.replace(/"/g, "%22")}")`;

  heroPoster.src = imageUrl;

  // Warm the browser cache for the next slide without delaying the current one.
  if (heroImages.length > 1) {
    const nextImage = heroImages[(heroIndex + 1) % heroImages.length];
    if (nextImage && nextImage.url) {
      const preload = new Image();
      preload.decoding = "async";
      preload.src = optimizeDriveImageUrl(nextImage.url, 1100);
    }
  }

  // Handle already-cached images
  if (heroPoster.complete && heroPoster.naturalWidth > 0) {
    heroPoster.style.opacity = "1";
  }
}

function openSelection(list, index) {
  selectionMovies = Array.isArray(list) ? list : [];
  selectionIndex = Number.isInteger(index) ? index : 0;

  const modal = document.getElementById("selectionModal");
  if (!modal || !selectionMovies.length) return;

  // Show the popup first. If any optional detail (poster, recommendations,
  // or episode metadata) fails to load, the main movie popup still opens.
  modal.classList.add("show");
  modal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";

  try {
    showSelection();
  } catch (error) {
    console.error("Movie popup detail rendering failed:", error);
    const title = document.getElementById("selectionTitle");
    const description = document.getElementById("selectionDescription");
    const movie = selectionMovies[selectionIndex];
    if (title) title.textContent = getDisplayTitle(movie);
    if (description) description.textContent = "";
  }
}

function showSelection() {
  if (!selectionMovies.length) return;

  const movie = selectionMovies[selectionIndex];
  currentSelectedVideo = movie;
  const posterUrl = getSeasonPoster(movie);
  const optimizedPoster = optimizeDriveImageUrl(posterUrl, 750);

function closeSelection() {

// MORE LIKE THIS

function renderRecommendations(currentMovie) {
  const row = document.getElementById("recommendationRow");
  row.innerHTML = "";

  // The Drive library does not currently contain genre/cast metadata,
  // so recommendations use matching series names and meaningful title words.
  const stopWords = new Set([
    "the", "and", "for", "with", "from", "this", "that", "part",
    "movie", "web", "series", "season", "complete", "episode", "ep",
    "hindi", "english", "dual", "audio", " dubbed", "1080p", "720p",
    "480p", "4k", "uhd", "webdl", "webrip", "bluray", "x264", "x265"
  ]);

  function titleWords(movie) {
    return String(movie.title || "")
      .toLowerCase()
      .replace(/\.[a-z0-9]{2,4}$/i, "")
      .replace(/\b(?:s\d{1,2}|season\s*\d{1,2}|e\d{1,3}|ep\s*\d{1,3}|\d{1,2}x\d{1,3})\b/gi, " ")
      .replace(/\b\d{3,4}p\b|\b\d+k\b|\b(19|20)\d{2}\b/gi, " ")
      .split(/[^a-z0-9]+/)
      .filter(word => word.length > 2 && !stopWords.has(word));
  }

  const currentCategory = normalizeCategory(currentMovie.category);
  const currentSeries = currentCategory === "Web Series"
    ? getSeriesName(currentMovie.title)
    : "";
  const currentWords = new Set(titleWords(currentMovie));

  // First show matching titles (same series / overlapping title words).
  const sameCategoryMovies = allMovies.filter(movie =>
    normalizeCategory(movie.category) === currentCategory &&
    movie.id !== currentMovie.id
  );

  const similarRecommendations = sameCategoryMovies
    .map(movie => {
      const category = normalizeCategory(movie.category);
      const sameSeries = currentSeries && category === "Web Series" &&
        getSeriesName(movie.title) === currentSeries;
      const words = titleWords(movie);
      const overlap = words.filter(word => currentWords.has(word)).length;
      const score = (sameSeries ? 100 : 0) +
        overlap * 10 +
        (category === currentCategory ? 2 : 0);

      return { movie, score, sameSeries, overlap };
    })
    .filter(item => item.sameSeries || item.overlap > 0)
    .sort((a, b) => b.score - a.score ||
      Number(b.movie.createdTime || 0) - Number(a.movie.createdTime || 0))
    .map(item => item.movie);

  // If fewer than 20 similar titles exist, fill the remaining spaces randomly
  // from the rest of the library. Similar titles always stay at the beginning.
  const similarIds = new Set(similarRecommendations.map(movie => movie.id));
  const randomRecommendations = sameCategoryMovies.filter(movie =>
    !similarIds.has(movie.id)
  );

  // Fisher-Yates shuffle for a genuinely random fallback order.
  for (let i = randomRecommendations.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [randomRecommendations[i], randomRecommendations[j]] =
      [randomRecommendations[j], randomRecommendations[i]];
  }

  const recommendations = [
    ...similarRecommendations,
    ...randomRecommendations
  ];
  const selected = recommendations.slice(0, 20);

  if (!selected.length) {
    const empty = document.createElement("div");
    empty.className = "status";
    empty.textContent = "No other videos available.";
    row.appendChild(empty);
    return;
  }

  selected.forEach(movie => {
    const card = document.createElement("div");
    card.className = "recommendation-card";

    const img = document.createElement("img");
    img.className = "recommendation-poster";
    img.alt = movie.title || "Poster";
    img.loading = "lazy";
    img.decoding = "async";
    img.fetchPriority = "low";
    img.src = optimizeDriveImageUrl(getSeasonPoster(movie), 360);

    img.onerror = () => {
      img.style.visibility = "hidden";
    };

    const title = document.createElement("div");
    title.className = "recommendation-title";
    title.textContent = getDisplayTitle(movie);

    card.append(img, title);

    card.addEventListener("click", () => {
      const index = recommendations.findIndex(item => item.id === movie.id);
      openSelection(recommendations, index);
    });

    row.appendChild(card);
  });
}

// WEB SERIES SEASON / EPISODE SELECTOR

function getSeriesName(title) {
  // Strip both episode-style and complete-season suffixes while keeping
  // the actual series name identical across all its files.
  return String(title || "")
    .replace(/\.(mp4|mkv|avi|mov|webm|m4v)$/i, "")
    .replace(/[._]+/g, " ")
    .replace(/\bS(?:eason)?\s*0*\d{1,2}\s*(?:\(\s*)?E[\s._-]*0*\d{1,3}\s*\)?/ig, " ")
    .replace(/\bSeason\s*0*\d{1,2}\s*(?:Episode|Ep|E)[\s._-]*0*\d{1,3}\b/ig, " ")
    .replace(/\b\d{1,2}\s*[xX]\s*0*\d{1,3}\b/g, " ")
    .replace(/\bS(?:eason)?\s*0*\d{1,2}\b/ig, " ")
    .replace(/\bSeason\s*0*\d{1,2}\b/ig, " ")
    .replace(/\b(?:Episode|Ep|E)[\s._-]*0*\d{1,3}\b/ig, " ")
    .replace(/\b(480p|720p|1080p|2160p|4k|HEVC|WEB[ ._-]?DL|Blu[ ._-]?Ray|HDR|ESub)\b/ig, " ")
    .replace(/\b(19|20)\d{2,3}\b/g, " ")
    .replace(/[()[\]{}_-]+/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}

function getEpisodeNumber(title) {
  const text = String(title || "");
  let match = text.match(/\bS(?:eason)?\s*0*\d{1,2}\s*(?:\(\s*)?E[\s._-]*0*(\d{1,3})\s*\)?/i);
  if (!match) match = text.match(/\b\d{1,2}\s*[xX]\s*0*(\d{1,3})\b/);
  if (!match) match = text.match(/\b(?:Episode|Ep|E)[\s._-]*0*(\d{1,3})\b/i);
  return match ? parseInt(match[1], 10) : 9999;
}

function getSeasonGroup(movie) {
  const season = getSeasonNumber(movie && movie.title);
  return season || "01";
}

function isCompleteSeasonFile(item) {
  const title = String(item && item.title || "");
  return !!getSeasonNumber(title) && getEpisodeNumber(title) === 9999 &&
    /\bseason\s*0*\d{1,2}\b/i.test(title);
}

function isWebSeriesMovie(item) {
  if (!item) return false;
  const categoryValues = [item.category, item.type, item.folder, item.folderName,
    item.categoryName, item.parentFolder].filter(Boolean);
  const isCategorizedSeries = categoryValues.some(value => {
    const key = String(value).toLowerCase().replace(/[^a-z0-9]/g, '');
    return key === 'webseries' || key === 'series';
  });
  if (isCategorizedSeries) return true;

  // Fallback for records whose API category field is missing but whose
  // filename clearly follows a TV-series naming convention.
  const title = String(item.title || '');
  return /\bS\s*0*\d{1,2}\s*(?:\(\s*)?E[\s._-]*0*\d{1,3}/i.test(title) ||
    /\bSeason\s*0*\d{1,2}\b/i.test(title) ||
    /\b\d{1,2}\s*[xX]\s*0*\d{1,3}\b/.test(title);
}

function renderSeriesEpisodes(movie) {
  const section = document.getElementById('episodeSection');
  const seasonSelect = document.getElementById('seasonSelect');
  const episodeSelect = document.getElementById('episodeSelect');
  const episodeList = document.getElementById('episodeList');

  section.classList.remove('show');
  seasonSelect.innerHTML = '';
  episodeSelect.innerHTML = '';
  episodeList.innerHTML = '';
  currentSelectedVideo = movie;

  // The season/episode controls belong only to Web Series items.
  if (!isWebSeriesMovie(movie)) return;

  const seriesName = getSeriesName(movie.title);
  const allSeriesItems = [...(Array.isArray(allMovies) ? allMovies : []),
    ...(Array.isArray(selectionMovies) ? selectionMovies : [])];
  const uniqueItems = new Map();
  allSeriesItems.forEach(item => {
    if (isWebSeriesMovie(item) && getSeriesName(item.title) === seriesName) {
      uniqueItems.set(String(item.id), item);
    }
  });
  // Always retain the selected item, even if the API/cache list is temporarily stale.
  if (movie && movie.id != null) uniqueItems.set(String(movie.id), movie);
  const episodes = [...uniqueItems.values()];

  if (!episodes.length) {
    console.warn('INOX: No Web Series items found for:', movie.title, movie.category);
    return;
  }

  const seasons = [...new Set(episodes.map(getSeasonGroup))]
    .sort((a, b) => Number(a) - Number(b));

  seasons.forEach(season => {
    const option = document.createElement('option');
    option.value = season;
    option.textContent = 'Season ' + Number(season);
    seasonSelect.appendChild(option);
  });

  function setSelectedEpisode(episode) {
    currentSelectedVideo = episode;
    document.getElementById('selectionPlay').textContent = '▶ PLAY EPISODE';
    episodeList.querySelectorAll('.episode-item').forEach(item => {
      const active = item.dataset.episodeId === String(episode.id);
      item.classList.toggle('active', active);
      item.setAttribute('aria-current', active ? 'true' : 'false');
    });
    episodeSelect.value = String(episode.id);
  }

  function renderEpisodesForSeason(season, preferredEpisodeId) {
    episodeList.innerHTML = '';
    episodeSelect.innerHTML = '';

    const seasonEpisodes = episodes
      .filter(item => getSeasonGroup(item) === String(season))
      .sort((a, b) => getEpisodeNumber(a.title) - getEpisodeNumber(b.title));

    seasonEpisodes.forEach((episode, index) => {
      const option = document.createElement('option');
      option.value = String(episode.id);
      const episodeNumber = getEpisodeNumber(episode.title);
      option.textContent = isCompleteSeasonFile(episode)
        ? 'Season ' + Number(getSeasonGroup(episode)) + ' (Complete)'
        : 'Episode ' + (episodeNumber === 9999 ? index + 1 : episodeNumber) +
          ' — ' + getEpisodeDisplayName(episode.title);
      episodeSelect.appendChild(option);

      const item = document.createElement('div');
      item.className = 'episode-item';
      item.tabIndex = 0;
      item.dataset.episodeId = String(episode.id);

      const number = document.createElement('div');
      number.className = 'episode-number';
      number.textContent = String(index + 1).padStart(2, '0');
      const name = document.createElement('div');
      name.className = 'episode-name';
      name.textContent = isCompleteSeasonFile(episode)
        ? 'Season ' + Number(getSeasonGroup(episode)) + ' (Complete)'
        : getEpisodeDisplayName(episode.title);
      const play = document.createElement('div');
      play.className = 'episode-play';
      play.textContent = '▶';
      item.append(number, name, play);

      const chooseEpisode = () => setSelectedEpisode(episode);
      item.addEventListener('click', chooseEpisode);
      item.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          chooseEpisode();
        }
      });
      episodeList.appendChild(item);
    });

    const selectedEpisode =
      seasonEpisodes.find(item => String(item.id) === String(preferredEpisodeId)) ||
      seasonEpisodes.find(item => String(item.id) === String(movie.id)) ||
      seasonEpisodes[0];

    if (selectedEpisode) setSelectedEpisode(selectedEpisode);
    else currentSelectedVideo = movie;
  }

  seasonSelect.onchange = () => renderEpisodesForSeason(seasonSelect.value, null);
  episodeSelect.onchange = () => {
    const chosen = episodes.find(item => String(item.id) === String(episodeSelect.value)) ||
      allMovies.find(item => String(item.id) === String(episodeSelect.value));
    if (chosen) setSelectedEpisode(chosen);
  };

  const initialSeason = getSeasonGroup(movie);
  seasonSelect.value = seasons.includes(initialSeason) ? initialSeason : seasons[0];
  renderEpisodesForSeason(seasonSelect.value, movie.id);
  section.classList.add('show');
}

function getEpisodeDisplayName(title) {
  let name = String(title || "");

  name = name
    .replace(/\.(mp4|mkv|avi|mov|webm|m4v)$/i, "")
    .replace(/\bS\d{1,2}\b/ig, "")
    .replace(/\bSeason[\s._-]*\d{1,2}\b/ig, "")
    .replace(/\b(?:EP?|Episode)[\s._-]*\d{1,3}\b/ig, "")
    .replace(/\b(19|20)\d{2,3}\b/g, "")
    .replace(/\b\d{1,2}x\d{1,3}\b/ig, "")
    .replace(/\b(480p|720p|1080p|2160p|4k|HEVC|WEB-DL|BluRay|HDR|ESub)\b/ig, "")
    .replace(/[()[\]_.-]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  return name || "Episode";
}

// GOOGLE DRIVE PLAYER

function playMovie(movie) {
  if (!movie.id) {
    alert("Movie ID is missing.");
    return;
  }

  const modal = document.getElementById("playerModal");
  const playerBox = document.getElementById("playerBox");
  const message = document.getElementById("playerMessage");

  const oldFrame = document.getElementById("drivePlayer");
  if (oldFrame) oldFrame.remove();

  message.textContent = "Loading " + (movie.title || "movie") + "...";

  const iframe = document.createElement("iframe");
  iframe.id = "drivePlayer";

  iframe.src =
    "https://drive.google.com/file/d/" +
    encodeURIComponent(movie.id) +
    "/preview";

  iframe.allow = "autoplay; fullscreen";
  iframe.allowFullscreen = true;
  iframe.title = movie.title || "Movie player";

  playerBox.appendChild(iframe);

  modal.classList.add("show");
  document.body.style.overflow = "hidden";

  setTimeout(() => {
    message.textContent = "";
  }, 5000);
}

function closePlayer() {
  const modal = document.getElementById("playerModal");
  const iframe = document.getElementById("drivePlayer");

  if (iframe) iframe.remove();

  modal.classList.remove("show");
  document.body.style.overflow = "";
}

document.getElementById("closePlayer")
  .addEventListener("click", closePlayer);

document.getElementById("playerModal")
  .addEventListener("click", event => {
    if (event.target === event.currentTarget) closePlayer();
  });

// SEARCH

document.getElementById("searchBox")
  .addEventListener("input", function() {
    renderCatalogue(allMovies);
  });

// CATEGORY NAVIGATION
document.querySelectorAll("#categoryNav [data-category]")
  .forEach(button => {
    button.addEventListener("click", function() {
      activeCategory = this.dataset.category || "Home";

      document.querySelectorAll("#categoryNav .nav-link")
        .forEach(item => item.classList.toggle("active", item === this));

      renderCatalogue(allMovies);

      // Always begin a category page at its heading, not at an old scroll offset.
      if (activeCategory === "Home") {
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        const target = document.querySelector("#catalogue .category-section");
        const header = document.querySelector("header");
        if (target) {
          const top = target.getBoundingClientRect().top + window.scrollY -
            (header ? header.offsetHeight : 0) - 12;
          window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
        }
      }
    });
  });

// THEME — remember the visitor's choice on this browser
const THEME_STORAGE_KEY = "adrashyaInoxTheme_v1";
const themeButton = document.getElementById("themeBtn");

function applyTheme(theme) {
  const isLight = theme === "light";
  document.body.classList.toggle("light", isLight);
  themeButton.textContent = isLight ? "🌙" : "☀️";
  themeButton.setAttribute("aria-label", isLight ? "Switch to Dark Mode" : "Switch to Light Mode");
  themeButton.title = isLight ? "Switch to Dark Mode" : "Switch to Light Mode";
}

let savedTheme = "dark";
try {
  savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || "dark";
} catch (error) {
  console.warn("Theme preference could not be read:", error);
}
applyTheme(savedTheme === "light" ? "light" : "dark");

themeButton.addEventListener("click", function() {
  const nextTheme = document.body.classList.contains("light") ? "dark" : "light";
  applyTheme(nextTheme);
  try {
    localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
  } catch (error) {
    console.warn("Theme preference could not be saved:", error);
  }
});

// KEYBOARD

document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") {
    closePlayer();
    closeSelection();
  }
});

// START

loadMovies();
