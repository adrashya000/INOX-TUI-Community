
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADRASHYA INOX | Unlimited Entertainment</title>

<style>
:root {
  --bg: #080808;
  --text: #ffffff;
  --muted: #aaaaaa;
  --accent: #e50914;
  --card: #181818;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
  transition: background .3s, color .3s;
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 17px 5%;
  background: rgba(8,8,8,.96);
}

.logo {
  color: var(--accent);
  font-size: 27px;
  font-weight: 900;
  letter-spacing: 1px;
}

.tagline {
  color: var(--muted);
  font-size: 11px;
  margin-top: 4px;
  letter-spacing: 2px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.search {
  width: 220px;
  padding: 10px 13px;
  border: 1px solid #555;
  border-radius: 5px;
  background: #171717;
  color: white;
  outline: none;
}

.search:focus {
  border-color: var(--accent);
}

.theme-btn {
  background: #333;
  border: 0;
  color: white;
  padding: 10px 13px;
  border-radius: 5px;
  cursor: pointer;
}

/* HERO BANNER */

.hero {
  min-height: 510px;
  padding: 65px 7%;
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background-color: #101010;
  background-image: linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.18));
  background-size: cover;
  background-position: center 30%;
  background-repeat: no-repeat;
  transition: background-image .35s ease;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.88) 0%,
      rgba(0,0,0,.62) 55%,
      rgba(0,0,0,.35) 100%
    ),
    linear-gradient(
      0deg,
      rgba(0,0,0,.55),
      rgba(0,0,0,.18)
    );
}

.hero-content {
  width: 100%;
  max-width: 750px;
  position: relative;
  z-index: 1;
}

.hero h1 {
  font-size: clamp(25px, 3.5vw, 42px);
  font-weight: 800;
  line-height: 1.2;
  max-width: 700px;
  overflow-wrap: anywhere;
  text-shadow: 0 2px 12px rgba(0,0,0,.8);
}

.hero-watch-btn {
  margin-top: 22px;
  border: 0;
  border-radius: 4px;
  padding: 12px 22px;
  background: var(--accent);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(0,0,0,.3);
}

.hero-watch-btn:hover {
  background: #b80710;
}

.hero-watch-btn:disabled {
  opacity: .55;
  cursor: not-allowed;
}

/* MOVIE SECTIONS */

main {
  padding: 10px 0 50px;
}

.category-section {
  margin: 25px 0 35px;
}

.category-title {
  padding: 0 5%;
  font-size: 23px;
  margin-bottom: 15px;
}

.category-row-block {
  width: 100%;
  min-width: 0;
  margin-bottom: 10px;
}

.row-heading {
  padding: 0 5%;
  margin: 4px 0 8px;
  color: var(--muted);
  font-size: 15px;
  font-weight: 700;
}

.row-shell {
  position: relative;
  display: block;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
}

.movie-row {
  display: flex;
  flex-wrap: nowrap;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  gap: 13px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 5px 5% 18px;
  scrollbar-width: thin;
  scrollbar-color: #555 #151515;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
  scroll-snap-type: x proximity;
  touch-action: pan-x;
}

.row-arrow {
  position: absolute;
  z-index: 4;
  top: 38%;
  width: 38px;
  height: 62px;
  border: 0;
  border-radius: 5px;
  background: rgba(0,0,0,.78);
  color: white;
  font-size: 26px;
  cursor: pointer;
  opacity: 0;
  transition: opacity .2s;
}

.row-shell:hover .row-arrow,
.row-arrow:focus {
  opacity: 1;
}

.row-arrow.left {
  left: 5px;
}

.row-arrow.right {
  right: 5px;
}

.movie-card {
  flex: 0 0 175px;
  cursor: pointer;
  transition: transform .25s;
  scroll-snap-align: start;
}

.movie-card:hover {
  transform: scale(1.06);
}

.poster {
  height: 245px;
  position: relative;
  overflow: hidden;
  border-radius: 7px;
  background: #242424;
}

.poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  inset: 0;
  z-index: 1;
}

.poster-placeholder {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px;
  color: var(--muted);
  font-weight: bold;
  overflow-wrap: anywhere;
}

.play-overlay {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.25);
  opacity: 0;
  transition: opacity .2s;
}

.movie-card:hover .play-overlay {
  opacity: 1;
}

.play-icon {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
}

.movie-title {
  font-size: 14px;
  font-weight: bold;
  margin-top: 9px;
  line-height: 1.4;
}

.status {
  text-align: center;
  padding: 30px;
  color: var(--muted);
}

/* MOVIE SELECTION POPUP */

.selection-box {
  position: relative;
  width: min(760px, 96%);
  min-height: 300px;
  background: #181818;
  border-radius: 10px;
  padding: 28px 55px;
}

.selection-content {
  display: flex;
  align-items: center;
  gap: 25px;
}

.selection-poster {
  width: 180px;
  height: 260px;
  object-fit: cover;
  border-radius: 7px;
  background: #333;
}

.selection-info {
  min-width: 0;
}

.selection-info h2 {
  font-size: 21px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.selection-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 18px;
}

.selection-actions .hero-watch-btn {
  margin-top: 0;
}

.resume-btn {
  border: 1px solid #777;
  border-radius: 4px;
  padding: 12px 22px;
  background: #333;
  color: white;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.resume-btn:hover {
  background: #505050;
}

.selection-nav {
  position: absolute;
  top: 45%;
  border: 0;
  background: #333;
  color: white;
  border-radius: 5px;
  width: 35px;
  height: 50px;
  font-size: 28px;
  cursor: pointer;
}

.selection-nav.prev {
  left: 10px;
}

.selection-nav.next {
  right: 10px;
}

/* VIDEO PLAYER */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.96);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.show {
  display: flex;
}

.player-box {
  width: min(1100px, 100%);
  height: min(650px, 85vh);
  position: relative;
  background: #000;
  border-radius: 8px;
  overflow: hidden;
}

.player-box iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.close-btn {
  position: absolute;
  z-index: 5;
  top: 12px;
  right: 15px;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: rgba(0,0,0,.8);
  color: white;
  font-size: 25px;
  cursor: pointer;
}

.player-message {
  position: absolute;
  bottom: 10px;
  left: 10px;
  z-index: 4;
  color: white;
  font-size: 12px;
  pointer-events: none;
}

footer {
  border-top: 1px solid #292929;
  text-align: center;
  padding: 25px;
  color: #777;
  font-size: 12px;
}

/* LIGHT MODE */

body.light {
  --bg: #f2f2f2;
  --text: #151515;
  --muted: #666;
}

body.light header {
  background: rgba(245,245,245,.97);
}

body.light .search {
  background: white;
  color: black;
}

body.light .hero {
  background-color: #333;
}

/* MOBILE */

@media(max-width:600px) {
  header {
    padding: 13px 4%;
    flex-wrap: wrap;
  }

  .logo {
    font-size: 22px;
  }

  .header-right {
    width: 100%;
  }

  .search {
    flex: 1;
    width: 100%;
  }

  .hero {
    min-height: 390px;
    padding: 40px 5%;
  }

  .hero h1 {
    font-size: clamp(22px, 6vw, 30px);
  }

  .hero-watch-btn {
    margin-top: 16px;
    padding: 10px 16px;
    font-size: 12px;
  }

  .row-arrow {
    opacity: .85;
    width: 30px;
    height: 48px;
  }

  .movie-card {
    flex-basis: 135px;
  }

  .poster {
    height: 195px;
  }

  .category-title {
    font-size: 19px;
  }

  .selection-box {
    padding: 55px 38px 25px;
  }

  .selection-content {
    flex-direction: column;
    text-align: center;
    gap: 15px;
  }

  .selection-poster {
    width: 135px;
    height: 195px;
  }

  .selection-info h2 {
    font-size: 16px;
  }

  .selection-actions {
    justify-content: center;
  }

  .modal {
    padding: 5px;
  }

  .player-box {
    height: 55vh;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <div class="logo">ADRASHYA INOX</div>
    <div class="tagline">UNLIMITED ENTERTAINMENT</div>
  </div>

  <div class="header-right">
    <input
      type="search"
      id="searchBox"
      class="search"
      placeholder="Search movies..."
      autocomplete="off"
    >
    <button class="theme-btn" id="themeBtn">☀ / ☾</button>
  </div>
</header>

<!-- HERO BANNER - NO FEATURED POSTER -->

<section class="hero" id="hero">
  <div class="hero-content">
    <h1 id="heroTitle">ADRASHYA INOX</h1>
    <button class="hero-watch-btn" id="heroWatchBtn" type="button">
      ▶ WATCH NOW
    </button>
  </div>
</section>

<main>
  <div id="catalogue">
    <div class="status">Loading your entertainment library...</div>
  </div>
</main>

<!-- MOVIE DETAILS / SELECTION MODAL -->

<div class="modal" id="selectionModal">
  <div class="selection-box">
    <button class="close-btn" id="closeSelection" aria-label="Close details">×</button>
    <button class="selection-nav prev" id="selectionPrev" aria-label="Previous movie">‹</button>

    <div class="selection-content">
      <img id="selectionPoster" class="selection-poster" alt="Movie poster">

      <div class="selection-info">
        <h2 id="selectionTitle"></h2>

        <div class="selection-actions">
          <button class="hero-watch-btn" id="selectionPlay" type="button">
            ▶ PLAY
          </button>

          <button class="resume-btn" id="selectionResume" type="button">
            ↻ RESUME
          </button>
        </div>
      </div>
    </div>

    <button class="selection-nav next" id="selectionNext" aria-label="Next movie">›</button>
  </div>
</div>

<!-- PLAYER MODAL -->

<div class="modal" id="playerModal">
  <div class="player-box" id="playerBox">
    <button class="close-btn" id="closePlayer" aria-label="Close player">×</button>
    <div class="player-message" id="playerMessage"></div>
  </div>
</div>

<footer>
  ADRASHYA INOX · Unlimited Entertainment
</footer>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbzismKAUniBCM3f9G3kyIMaDBz7KKE0YvZE6kgQcCWCNFBruBEczDej6EiWLE8WvQeB/exec";

const CATEGORIES = ["Movies", "Web Series", "Animation"];

let allMovies = [];
let heroMovies = [];
let heroIndex = 0;
let heroTimer = null;

// Load Google Drive library

function loadMovies() {
  const callbackName = "inoxCallback";

  window[callbackName] = function(data) {
    if (data && Array.isArray(data.movies)) {
      allMovies = data.movies;

      renderCatalogue(allMovies);
      startHeroSlideshow();
    } else {
      showError("Unexpected API response.");
    }

    delete window[callbackName];

    const script = document.getElementById("inoxApiScript");
    if (script) script.remove();
  };

  const script = document.createElement("script");
  script.id = "inoxApiScript";
  script.src = API_URL +
    "?callback=" + callbackName +
    "&t=" + Date.now();

  script.onerror = function() {
    showError("Unable to connect to Google Drive API.");
    delete window[callbackName];
    script.remove();
  };

  document.body.appendChild(script);
}

function showError(message) {
  document.getElementById("catalogue").textContent = message;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char];
  });
}

/* CATEGORY NORMALIZATION */

function normalizeCategory(value) {
  const key = String(value || "")
    .trim()
    .toLowerCase()
    .replace(/[\s_-]+/g, "");

  if (key === "movie" || key === "movies") {
    return "Movies";
  }

  if (key === "webseries" || key === "series") {
    return "Web Series";
  }

  if (
    key === "animation" ||
    key === "animations" ||
    key === "cartoonmovies"
  ) {
    return "Animation";
  }

  return String(value || "Other").trim() || "Other";
}

// Display only one row for each category.

function renderCatalogue(movies) {
  const catalogue = document.getElementById("catalogue");
  catalogue.innerHTML = "";

  if (!movies.length) {
    catalogue.innerHTML = '<div class="status">No videos found.</div>';
    return;
  }

  const categories = [...new Set([
    ...CATEGORIES,
    ...movies.map(movie => normalizeCategory(movie.category))
  ])];

  function createMovieRow(rowMovies, label) {
    if (!rowMovies.length) return null;

    const rowBlock = document.createElement("div");
    rowBlock.className = "category-row-block";

    const rowHeading = document.createElement("h3");
    rowHeading.className = "row-heading";
    rowHeading.textContent = label;

    const rowShell = document.createElement("div");
    rowShell.className = "row-shell";

    const row = document.createElement("div");
    row.className = "movie-row";

    rowMovies.forEach((movie, index) => {
      row.appendChild(createMovieCard(movie, rowMovies, index));
    });

    const leftArrow = document.createElement("button");
    leftArrow.className = "row-arrow left";
    leftArrow.type = "button";
    leftArrow.textContent = "‹";
    leftArrow.setAttribute("aria-label", "Scroll left");

    leftArrow.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();

      row.scrollBy({
        left: -Math.max(220, row.clientWidth * 0.8),
        behavior: "smooth"
      });
    });

    const rightArrow = document.createElement("button");
    rightArrow.className = "row-arrow right";
    rightArrow.type = "button";
    rightArrow.textContent = "›";
    rightArrow.setAttribute("aria-label", "Scroll right");

    rightArrow.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();

      row.scrollBy({
        left: Math.max(220, row.clientWidth * 0.8),
        behavior: "smooth"
      });
    });

    rowShell.append(leftArrow, row, rightArrow);
    rowBlock.append(rowHeading, rowShell);

    return rowBlock;
  }

  categories.forEach(category => {
    const categoryMovies = movies.filter(movie =>
      normalizeCategory(movie.category) === category
    );

    if (!categoryMovies.length) return;

    const section = document.createElement("section");
    section.className = "category-section";

    const heading = document.createElement("h2");
    heading.className = "category-title";
    heading.textContent = category;

    section.appendChild(heading);

    let rowLabel;

    if (category === "Movies") {
      rowLabel = "All Movies";
    } else if (category === "Web Series") {
      rowLabel = "All Web Series";
    } else if (category === "Animation") {
      rowLabel = "All Animation";
    } else {
      rowLabel = "All " + category;
    }

    const allRow = createMovieRow(categoryMovies, rowLabel);

    if (allRow) {
      section.appendChild(allRow);
    }

    catalogue.appendChild(section);
  });
}

// Keep original Drive filenames and IDs unchanged.

function getDisplayTitle(movie) {
  return String(movie.title || "Untitled");
}

// Movie poster card

function createMovieCard(movie, categoryMovies = [movie], index = 0) {
  const card = document.createElement("div");
  card.className = "movie-card";
  card.tabIndex = 0;

  const poster = document.createElement("div");
  poster.className = "poster";

  const placeholder = document.createElement("div");
  placeholder.className = "poster-placeholder";
  placeholder.textContent = getDisplayTitle(movie) || "Movie";

  poster.appendChild(placeholder);

  if (movie.thumbnail) {
    const img = document.createElement("img");
    img.src = movie.thumbnail;
    img.alt = movie.title || "Movie poster";
    img.loading = "lazy";

    img.onerror = function() {
      img.remove();
    };

    poster.appendChild(img);
  }

  const overlay = document.createElement("div");
  overlay.className = "play-overlay";

  const playIcon = document.createElement("div");
  playIcon.className = "play-icon";
  playIcon.textContent = "▶";

  overlay.appendChild(playIcon);
  poster.appendChild(overlay);

  const title = document.createElement("div");
  title.className = "movie-title";
  title.textContent = getDisplayTitle(movie) || "Untitled";

  card.appendChild(poster);
  card.appendChild(title);

  card.addEventListener("click", () => openSelection(categoryMovies, index));

  card.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      openSelection(categoryMovies, index);
    }
  });

  return card;
}

// HERO SLIDESHOW

const FEATURED_MOVIES = [
  "Aadu 3_2026_720p WEB-DL",
  "Aakhri Sawal (2026)",
  "Akka S1 (2026) Hindi Completed Web Series HD ESub 1080p",
  "Dhurandhar 2_The Revenge_2026_Quality_1080p HEVC WEB-DL x265"
];

function normalizeMovieTitle(title) {
  return String(title || "")
    .trim()
    .replace(/\.(mp4|mkv|avi|mov|webm|m4v)$/i, "")
    .toLowerCase();
}

function startHeroSlideshow() {
  heroMovies = FEATURED_MOVIES
    .map(featuredTitle => {
      const wantedTitle = normalizeMovieTitle(featuredTitle);

      return allMovies.find(movie =>
        normalizeMovieTitle(movie.title) === wantedTitle && movie.id
      );
    })
    .filter(Boolean);

  if (heroTimer) clearInterval(heroTimer);
  heroIndex = 0;

  if (!heroMovies.length) {
    document.getElementById("heroTitle").textContent = "ADRASHYA INOX";
    document.getElementById("hero").style.backgroundImage = "none";
    document.getElementById("heroWatchBtn").disabled = true;
    return;
  }

  document.getElementById("heroWatchBtn").disabled = false;

  showHeroSlide(0);

  heroTimer = setInterval(() => {
    showHeroSlide((heroIndex + 1) % heroMovies.length);
  }, 5000);

  if (heroMovies.length < FEATURED_MOVIES.length) {
    console.warn(
      "Some featured titles were not found. Check FEATURED_MOVIES:",
      FEATURED_MOVIES
    );
  }
}

function showHeroSlide(index) {
  if (!heroMovies.length) return;

  heroIndex = (index + heroMovies.length) % heroMovies.length;

  const movie = heroMovies[heroIndex];

  document.getElementById("heroTitle").textContent =
    getDisplayTitle(movie) || "Untitled";

  const hero = document.getElementById("hero");

  if (movie.thumbnail) {
    hero.style.backgroundImage =
      `url("${String(movie.thumbnail).replace(/"/g, '%22')}")`;
  } else {
    hero.style.backgroundImage = "none";
  }
}

// Play the currently featured slideshow item.

document.getElementById("heroWatchBtn").addEventListener("click", function() {
  const movie = heroMovies[heroIndex];

  if (movie) playMovie(movie);
});

// MOVIE SELECTION POPUP

let selectionMovies = [];
let selectionIndex = 0;
let touchStartX = 0;

function openSelection(list, index) {
  selectionMovies = list || [];
  selectionIndex = index || 0;

  showSelection();

  document.getElementById("selectionModal").classList.add("show");
  document.body.style.overflow = "hidden";
}

function showSelection() {
  if (!selectionMovies.length) return;

  const movie = selectionMovies[selectionIndex];

  const poster = document.getElementById("selectionPoster");

  poster.src = movie.thumbnail || "";
  poster.style.visibility = movie.thumbnail ? "visible" : "hidden";
  poster.alt = movie.title || "Movie poster";

  document.getElementById("selectionTitle").textContent =
    getDisplayTitle(movie);
}

function moveSelection(step) {
  if (!selectionMovies.length) return;

  selectionIndex =
    (selectionIndex + step + selectionMovies.length) % selectionMovies.length;

  showSelection();
}

function closeSelection() {
  document.getElementById("selectionModal").classList.remove("show");

  if (!document.getElementById("playerModal").classList.contains("show")) {
    document.body.style.overflow = "";
  }
}

document.getElementById("selectionPrev")
  .addEventListener("click", () => moveSelection(-1));

document.getElementById("selectionNext")
  .addEventListener("click", () => moveSelection(1));

document.getElementById("closeSelection")
  .addEventListener("click", closeSelection);

document.getElementById("selectionPlay")
  .addEventListener("click", () => {
    const movie = selectionMovies[selectionIndex];

    if (movie) {
      closeSelection();
      playMovie(movie);
    }
  });

document.getElementById("selectionResume")
  .addEventListener("click", () => {
    const movie = selectionMovies[selectionIndex];

    if (!movie) return;

    alert(
      "Resume position is not available with Google Drive Preview. " +
      "The built-in ADRASHYA INOX player will be required for true Resume playback."
    );
  });

document.getElementById("selectionModal")
  .addEventListener("click", event => {
    if (event.target.id === "selectionModal") {
      closeSelection();
    }
  });

document.getElementById("selectionModal")
  .addEventListener("touchstart", event => {
    touchStartX = event.changedTouches[0].screenX;
  }, { passive: true });

document.getElementById("selectionModal")
  .addEventListener("touchend", event => {
    const delta =
      event.changedTouches[0].screenX - touchStartX;

    if (Math.abs(delta) > 55) {
      moveSelection(delta < 0 ? 1 : -1);
    }
  }, { passive: true });

document.addEventListener("keydown", event => {
  if (!document.getElementById("selectionModal").classList.contains("show")) {
    return;
  }

  if (event.key === "ArrowLeft") moveSelection(-1);
  if (event.key === "ArrowRight") moveSelection(1);
});

// GOOGLE DRIVE VIDEO PLAYER

function playMovie(movie) {
  if (!movie.id) {
    alert("Movie ID is missing.");
    return;
  }

  const modal = document.getElementById("playerModal");
  const playerBox = document.getElementById("playerBox");
  const message = document.getElementById("playerMessage");

  const oldFrame = document.getElementById("drivePlayer");

  if (oldFrame) oldFrame.remove();

  message.textContent = "Loading " + (movie.title || "movie") + "...";

  const iframe = document.createElement("iframe");

  iframe.id = "drivePlayer";

  iframe.src =
    "https://drive.google.com/file/d/" +
    encodeURIComponent(movie.id) +
    "/preview";

  iframe.allow = "autoplay; fullscreen";
  iframe.allowFullscreen = true;
  iframe.title = movie.title || "Movie player";

  playerBox.appendChild(iframe);

  modal.classList.add("show");
  document.body.style.overflow = "hidden";

  setTimeout(() => {
    message.textContent = "";
  }, 5000);
}

function closePlayer() {
  const modal = document.getElementById("playerModal");
  const iframe = document.getElementById("drivePlayer");

  if (iframe) iframe.remove();

  modal.classList.remove("show");
  document.body.style.overflow = "";
}

document.getElementById("closePlayer")
  .addEventListener("click", closePlayer);

document.getElementById("playerModal")
  .addEventListener("click", function(event) {
    if (event.target === this) closePlayer();
  });

document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") closePlayer();
});

// SEARCH

document.getElementById("searchBox")
  .addEventListener("input", function() {
    const query = this.value.trim().toLowerCase();

    const filtered = allMovies.filter(movie =>
      String(movie.title || "").toLowerCase().includes(query)
    );

    renderCatalogue(filtered);
  });

// THEME

document.getElementById("themeBtn")
  .addEventListener("click", function() {
    document.body.classList.toggle("light");
  });

// START

loadMovies();

</script>
