
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INOX | My Movie Library</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #080808;
    padding: 20px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    color: #e50914;
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 2px;
}

#search {
    padding: 12px 16px;
    width: 260px;
    max-width: 100%;
    background: #222;
    border: 1px solid #555;
    border-radius: 5px;
    color: white;
    font-size: 15px;
}

.hero {
    padding: 35px 5% 15px;
}

.hero h1 {
    margin: 0 0 8px;
    font-size: 30px;
}

.hero p {
    color: #aaa;
    margin: 0;
}

.categories {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    padding: 20px 5%;
}

.category {
    background: #292929;
    color: white;
    border: 0;
    border-radius: 20px;
    padding: 10px 18px;
    cursor: pointer;
}

.category.active {
    background: #e50914;
}

#status {
    padding: 5px 5%;
    color: #aaa;
    font-size: 14px;
}

.movies {
    padding: 15px 5% 40px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
    gap: 22px;
}

.card {
    background: #1d1d1d;
    border-radius: 8px;
    overflow: hidden;
    transition: transform 0.2s;
}

.card:hover {
    transform: scale(1.04);
}

.poster {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    background: #333;
    display: block;
}

.info {
    padding: 12px;
}

.movie-title {
    font-size: 14px;
    font-weight: bold;
    height: 38px;
    line-height: 19px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow-wrap: anywhere;
}

.movie-category {
    font-size: 12px;
    color: #aaa;
    margin: 7px 0 12px;
}

.action {
    width: 100%;
    padding: 9px 5px;
    margin-top: 7px;
    border: 0;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}

.play {
    background: #e50914;
    color: white;
}

.vlc {
    background: #333;
    color: white;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px 10px;
    color: #aaa;
}

footer {
    text-align: center;
    color: #666;
    padding: 25px;
    font-size: 12px;
}

@media (max-width: 500px) {
    header { padding: 16px 4%; }
    .movies {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">INOX</div>
    <input id="search" type="search" placeholder="Search movies...">
</header>

<section class="hero">
    <h1>My Movie Library</h1>
    <p>Your personal entertainment collection</p>
</section>

<nav class="categories">
    <button class="category active" data-category="all">All</button>
    <button class="category" data-category="Movies">Movies</button>
    <button class="category" data-category="Animation">Animation</button>
    <button class="category" data-category="Video song">Video Songs</button>
    <button class="category" data-category="Web_Series">Web Series</button>
</nav>

<div id="status">Connecting to Google Drive...</div>

<main class="movies" id="movies">
    <div class="empty">Loading your library...</div>
</main>

<footer>INOX · Your Personal Movie Library</footer>

<script>
const API = "";
const STREAM_URL = "http://127.0.0.1:8080/";

let allMovies = [];
let activeCategory = "all";

const movieGrid = document.getElementById("movies");
const statusText = document.getElementById("status");
const searchInput = document.getElementById("search");

function setStatus(message) {
    statusText.textContent = message;
}

function renderMovies() {
    const search = searchInput.value.trim().toLowerCase();

    const filtered = allMovies.filter(movie => {
        const categoryMatch =
            activeCategory === "all" ||
            movie.category === activeCategory;

        const searchMatch =
            movie.name.toLowerCase().includes(search);

        return categoryMatch && searchMatch;
    });

    movieGrid.replaceChildren();

    if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No videos found.";
        movieGrid.appendChild(empty);
        return;
    }

    filtered.forEach(movie => {
        const card = document.createElement("article");
        card.className = "card";

        const poster = document.createElement("img");
        poster.className = "poster";
        poster.alt = movie.name;
        poster.loading = "lazy";
        poster.src = movie.poster || "";
        poster.onerror = () => {
            poster.onerror = null;
            poster.src = "data:image/svg+xml," +
                encodeURIComponent(
                    '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450"><rect width="100%" height="100%" fill="#333"/><text x="50%" y="50%" fill="white" text-anchor="middle" font-size="24">INOX</text></svg>'
                );
        };

        const info = document.createElement("div");
        info.className = "info";

        const title = document.createElement("div");
        title.className = "movie-title";
        title.textContent = movie.name;

        const category = document.createElement("div");
        category.className = "movie-category";
        category.textContent = movie.category;

        const playButton = document.createElement("button");
        playButton.className = "action play";
        playButton.textContent = "▶ Play in Browser";
        playButton.addEventListener("click", () => {
            window.open(
                STREAM_URL + "?id=" + encodeURIComponent(movie.id),
                "_blank"
            );
        });

        const vlcButton = document.createElement("button");
        vlcButton.className = "action vlc";
        vlcButton.textContent = "▶ Open with VLC";
        vlcButton.addEventListener("click", () => openVLC(movie.id));

        info.append(title, category, playButton, vlcButton);
        card.append(poster, info);
        movieGrid.appendChild(card);
    });
}

async function openVLC(id) {
    try {
        const response = await fetch(
            "/api/open-vlc?id=" + encodeURIComponent(id)
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.error || "Could not open VLC");
        }

        setStatus("Opening movie in VLC...");
    } catch (error) {
        alert("VLC error: " + error.message);
    }
}

async function loadMovies(category = "all") {
    activeCategory = category;
    setStatus("Loading videos from Google Drive...");

    movieGrid.replaceChildren();

    const loading = document.createElement("div");
    loading.className = "empty";
    loading.textContent = "Please wait...";
    movieGrid.appendChild(loading);

    try {
        const response = await fetch(
            "/api/videos?category=" + encodeURIComponent(category)
        );

        if (!response.ok) {
            throw new Error("Server returned HTTP " + response.status);
        }

        const data = await response.json();

        allMovies = Array.isArray(data) ? data : (data.videos || []);

        allMovies = allMovies.map(movie => ({
            ...movie,
            name: movie.name || movie.title || "Untitled",
            poster: movie.poster || "",
            category: movie.category || ""
        }));

        setStatus(allMovies.length + " videos loaded from Google Drive");
        renderMovies();

    } catch (error) {
        setStatus("Unable to load Google Drive videos.");
        movieGrid.replaceChildren();

        const message = document.createElement("div");
        message.className = "empty";
        message.textContent = error.message;
        movieGrid.appendChild(message);
    }
}

document.querySelectorAll(".category").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelectorAll(".category").forEach(item => {
            item.classList.remove("active");
        });

        button.classList.add("active");
        searchInput.value = "";
        loadMovies(button.dataset.category);
    });
});

searchInput.addEventListener("input", renderMovies);

loadMovies();
</script>

</body>
</html>
