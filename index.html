
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADARSHYA INOX | Unlimited Entertainment</title>

<style>
:root {
  --bg: #080808;
  --text: #ffffff;
  --muted: #aaaaaa;
  --accent: #e50914;
  --card: #181818;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
  transition: background .3s, color .3s;
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 17px 5%;
  background: rgba(8,8,8,.96);
}

.logo {
  color: var(--accent);
  font-size: 27px;
  font-weight: 900;
  letter-spacing: 1px;
}

.tagline {
  color: var(--muted);
  font-size: 11px;
  margin-top: 4px;
  letter-spacing: 2px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.search {
  width: 220px;
  padding: 10px 13px;
  border: 1px solid #555;
  border-radius: 5px;
  background: #171717;
  color: white;
  outline: none;
}

.search:focus {
  border-color: var(--accent);
}

.theme-btn {
  background: #333;
  border: 0;
  color: white;
  padding: 10px 13px;
  border-radius: 5px;
  cursor: pointer;
}

/* HERO SLIDESHOW */

.hero {
  height: 480px;
  min-height: 480px;
  max-height: 480px;
  padding: 70px 6% 80px;
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
  background-color: #151515;
  background-size: cover;
  background-position: center 30%;
  transition: background-image .6s ease;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    90deg,
    #080808 3%,
    rgba(8,8,8,.82) 42%,
    rgba(8,8,8,.12) 100%
  );
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    0deg,
    #080808 0%,
    transparent 55%
  );
}

.hero-content {
  max-width: 650px;
  position: relative;
  z-index: 2;
}

.hero-category {
  color: #ff343d;
  font-weight: bold;
  letter-spacing: 3px;
  margin-bottom: 15px;
  text-transform: uppercase;
}

.hero h1 {
  font-size: clamp(25px, 3.2vw, 40px);
  margin-bottom: 15px;
  font-weight: 900;
  line-height: 1.15;
  min-height: 2.3em;
  max-width: 650px;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  text-shadow: 0 2px 12px #000;
}

.hero p {
  color: #eee;
  font-size: 17px;
  line-height: 1.6;
  margin-bottom: 25px;
  max-width: 500px;
}

.hero-watch {
  padding: 14px 27px;
  border: 0;
  border-radius: 4px;
  background: var(--accent);
  color: white;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

.hero-watch:hover {
  background: #ff202a;
}

.hero-controls {
  position: absolute;
  right: 6%;
  bottom: 35px;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 15px;
}

.hero-controls button {
  background: rgba(0,0,0,.7);
  color: white;
  border: 1px solid #777;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  cursor: pointer;
  font-size: 16px;
}

.hero-controls button:hover {
  background: var(--accent);
}

.hero-controls span {
  color: white;
  font-size: 13px;
}

/* MOVIE SECTIONS */

main {
  padding: 10px 0 50px;
}

.category-section {
  margin: 25px 0 35px;
}

.category-title {
  padding: 0 5%;
  font-size: 23px;
  margin-bottom: 15px;
}

.movie-row {
  display: flex;
  gap: 13px;
  overflow-x: auto;
  padding: 5px 5% 18px;
  scrollbar-width: thin;
  scrollbar-color: #555 #151515;
}

.movie-card {
  flex: 0 0 175px;
  cursor: pointer;
  transition: transform .25s;
}

.movie-card:hover {
  transform: scale(1.06);
}

.poster {
  height: 245px;
  position: relative;
  overflow: hidden;
  border-radius: 7px;
  background: #242424;
}

.poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  inset: 0;
  z-index: 1;
}

.poster-placeholder {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px;
  color: var(--muted);
  font-weight: bold;
  overflow-wrap: anywhere;
}

.play-overlay {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.25);
  opacity: 0;
  transition: opacity .2s;
}

.movie-card:hover .play-overlay {
  opacity: 1;
}

.play-icon {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
}

.movie-title {
  font-size: 14px;
  font-weight: bold;
  margin-top: 9px;
  line-height: 1.4;
}

.movie-category {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
}

.status {
  text-align: center;
  padding: 30px;
  color: var(--muted);
}

/* VIDEO PLAYER */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.96);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.show {
  display: flex;
}

.player-box {
  width: min(1100px, 100%);
  height: min(650px, 85vh);
  position: relative;
  background: #000;
  border-radius: 8px;
  overflow: hidden;
}

.player-box iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.close-btn {
  position: absolute;
  z-index: 5;
  top: 12px;
  right: 15px;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: rgba(0,0,0,.8);
  color: white;
  font-size: 25px;
  cursor: pointer;
}

.player-message {
  position: absolute;
  bottom: 10px;
  left: 10px;
  z-index: 4;
  color: white;
  font-size: 12px;
  pointer-events: none;
}

footer {
  border-top: 1px solid #292929;
  text-align: center;
  padding: 25px;
  color: #777;
  font-size: 12px;
}

/* LIGHT MODE */

body.light {
  --bg: #f2f2f2;
  --text: #151515;
  --muted: #666;
}

body.light header {
  background: rgba(245,245,245,.97);
}

body.light .search {
  background: white;
  color: black;
}

body.light .hero {
  background-color: #333;
}

@media(max-width:600px) {
  header {
    padding: 13px 4%;
    flex-wrap: wrap;
  }

  .logo {
    font-size: 22px;
  }

  .header-right {
    width: 100%;
  }

  .search {
    flex: 1;
    width: 100%;
  }

  .hero {
    height: 380px;
    min-height: 380px;
    max-height: 380px;
    padding: 55px 5% 75px;
    background-position: center;
  }

  .hero h1 {
    font-size: clamp(24px, 7vw, 32px);
    min-height: 2.3em;
  }

  .hero p {
    font-size: 14px;
  }

  .movie-card {
    flex-basis: 135px;
  }

  .poster {
    height: 195px;
  }

  .category-title {
    font-size: 19px;
  }

  .modal {
    padding: 5px;
  }

  .player-box {
    height: 55vh;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <div class="logo">ADARSHYA INOX</div>
    <div class="tagline">UNLIMITED ENTERTAINMENT</div>
  </div>

  <div class="header-right">
    <input
      type="search"
      id="searchBox"
      class="search"
      placeholder="Search movies..."
      autocomplete="off"
    >
    <button class="theme-btn" id="themeBtn">☀ / ☾</button>
  </div>
</header>

<!-- HERO -->
<section class="hero" id="hero">
  <div class="hero-content">
    <div class="hero-category" id="heroCategory">
      ADARSHYA INOX ORIGINALS
    </div>

    <h1 id="heroTitle">Unlimited Entertainment</h1>

    <p id="heroDescription">
      Discover your favourite movies, web series and animation.
    </p>

    <button class="hero-watch" id="heroWatchBtn">
      ▶ WATCH NOW
    </button>
  </div>

  <div class="hero-controls">
    <button id="heroPrev" aria-label="Previous slide">❮</button>
    <span id="heroCounter">0 / 0</span>
    <button id="heroNext" aria-label="Next slide">❯</button>
  </div>
</section>

<main>
  <div id="catalogue">
    <div class="status">Loading your entertainment library...</div>
  </div>
</main>

<!-- PLAYER MODAL -->
<div class="modal" id="playerModal">
  <div class="player-box" id="playerBox">
    <button class="close-btn" id="closePlayer" aria-label="Close player">×</button>
    <div class="player-message" id="playerMessage"></div>
  </div>
</div>

<footer>
  ADARSHYA INOX · Unlimited Entertainment
</footer>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbzismKAUniBCM3f9G3kyIMaDBz7KKE0YvZE6kgQcCWCNFBruBEczDej6EiWLE8WvQeB/exec";

const CATEGORIES = ["Movies", "Web Series", "Animation"];

let allMovies = [];
let heroMovies = [];
let heroIndex = 0;
let heroTimer = null;

// Load Google Drive library
function loadMovies() {
  const callbackName = "inoxCallback";

  window[callbackName] = function(data) {
    if (data && Array.isArray(data.movies)) {
      allMovies = data.movies;

      renderCatalogue(allMovies);
      startHeroSlideshow();
    } else {
      showError("Unexpected API response.");
    }

    delete window[callbackName];

    const script = document.getElementById("inoxApiScript");
    if (script) script.remove();
  };

  const script = document.createElement("script");
  script.id = "inoxApiScript";
  script.src = API_URL +
    "?callback=" + callbackName +
    "&t=" + Date.now();

  script.onerror = function() {
    showError("Unable to connect to Google Drive API.");
    delete window[callbackName];
    script.remove();
  };

  document.body.appendChild(script);
}

function showError(message) {
  document.getElementById("catalogue").textContent = message;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char];
  });
}

// Display all movie categories
function renderCatalogue(movies) {
  const catalogue = document.getElementById("catalogue");
  catalogue.innerHTML = "";

  if (!movies.length) {
    catalogue.innerHTML =
      '<div class="status">No videos found.</div>';
    return;
  }

  const categories = [
    ...CATEGORIES,
    ...new Set(
      movies.map(movie => movie.category || "Other")
        .filter(category => !CATEGORIES.includes(category))
    )
  ];

  categories.forEach(category => {
    const categoryMovies = movies.filter(movie =>
      String(movie.category || "Other").toLowerCase() ===
      String(category).toLowerCase()
    );

    if (!categoryMovies.length) return;

    const section = document.createElement("section");
    section.className = "category-section";

    const heading = document.createElement("h2");
    heading.className = "category-title";
    heading.textContent = category;

    const row = document.createElement("div");
    row.className = "movie-row";

    categoryMovies.forEach(movie => {
      row.appendChild(createMovieCard(movie));
    });

    section.appendChild(heading);
    section.appendChild(row);
    catalogue.appendChild(section);
  });
}

// Movie poster card
function createMovieCard(movie) {
  const card = document.createElement("div");
  card.className = "movie-card";
  card.tabIndex = 0;

  const poster = document.createElement("div");
  poster.className = "poster";

  const placeholder = document.createElement("div");
  placeholder.className = "poster-placeholder";
  placeholder.textContent = movie.title || "Movie";

  poster.appendChild(placeholder);

  if (movie.thumbnail) {
    const img = document.createElement("img");
    img.src = movie.thumbnail;
    img.alt = movie.title || "Movie poster";
    img.loading = "lazy";

    img.onerror = function() {
      img.remove();
    };

    poster.appendChild(img);
  }

  const overlay = document.createElement("div");
  overlay.className = "play-overlay";

  const playIcon = document.createElement("div");
  playIcon.className = "play-icon";
  playIcon.textContent = "▶";

  overlay.appendChild(playIcon);
  poster.appendChild(overlay);

  const title = document.createElement("div");
  title.className = "movie-title";
  title.textContent = movie.title || "Untitled";

  const category = document.createElement("div");
  category.className = "movie-category";
  category.textContent = movie.category || "";

  card.appendChild(poster);
  card.appendChild(title);
  card.appendChild(category);

  card.addEventListener("click", () => playMovie(movie));

  card.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      playMovie(movie);
    }
  });

  return card;
}

// HERO SLIDESHOW
// Change these three names whenever you want to feature different movies.
const FEATURED_MOVIES = [
"Aadu 3_2026_720p WEB-DL"
"Aakhri Sawal (2026)"
"Akka S1 (2026) Hindi Completed Web Series HD ESub 1080p"
"Dhurandhar 2_The Revenge_2026_Quality_1080p HEVC WEB-DL x265"
];

// Compare titles without being affected by capital letters or video extensions.
function normalizeMovieTitle(title) {
  return String(title || "")
    .trim()
    .replace(/\\.(mp4|mkv|avi|mov|webm|m4v)$/i, "")
    .toLowerCase();
}

function startHeroSlideshow() {
  heroMovies = FEATURED_MOVIES
    .map(featuredTitle => {
      const wantedTitle = normalizeMovieTitle(featuredTitle);
      return allMovies.find(movie =>
        normalizeMovieTitle(movie.title) === wantedTitle && movie.id
      );
    })
    .filter(Boolean);

  if (heroTimer) clearInterval(heroTimer);

  heroIndex = 0;

  if (!heroMovies.length) {
    document.getElementById("heroTitle").textContent =
      "Featured movies not found";
    document.getElementById("heroDescription").textContent =
      "Check that the three featured titles match the movie names in Google Drive.";
    document.getElementById("heroCounter").textContent = "0 / 0";
    return;
  }

  showHeroSlide(0);

  heroTimer = setInterval(() => {
    showHeroSlide((heroIndex + 1) % heroMovies.length);
  }, 5000);

  if (heroMovies.length < FEATURED_MOVIES.length) {
    console.warn(
      "Some featured movies were not found. Check FEATURED_MOVIES names:",
      FEATURED_MOVIES
    );
  }
}

function showHeroSlide(index) {
  if (!heroMovies.length) return;

  heroIndex = (index + heroMovies.length) % heroMovies.length;

  const movie = heroMovies[heroIndex];
  const hero = document.getElementById("hero");

  document.getElementById("heroTitle").textContent =
    movie.title || "Untitled";

  document.getElementById("heroCategory").textContent =
    movie.category || "ADARSHYA INOX";

  document.getElementById("heroDescription").textContent =
    "Now streaming on ADARSHYA INOX. Enjoy unlimited entertainment.";

  document.getElementById("heroCounter").textContent =
    (heroIndex + 1) + " / " + heroMovies.length;

  if (movie.thumbnail) {
    const safePoster = movie.thumbnail.replace(/'/g, "%27");

    hero.style.backgroundImage =
      "linear-gradient(90deg, #080808 3%, rgba(8,8,8,.65) 50%, rgba(8,8,8,.15)), url('" +
      safePoster + "')";
  } else {
    hero.style.backgroundImage = "none";
  }

  document.getElementById("heroWatchBtn").onclick = function() {
    playMovie(movie);
  };
}

document.getElementById("heroPrev").addEventListener("click", function() {
  showHeroSlide(heroIndex - 1);
  restartHeroTimer();
});

document.getElementById("heroNext").addEventListener("click", function() {
  showHeroSlide(heroIndex + 1);
  restartHeroTimer();
});

function restartHeroTimer() {
  if (heroTimer) clearInterval(heroTimer);

  heroTimer = setInterval(() => {
    showHeroSlide(heroIndex + 1);
  }, 5000);
}

// GOOGLE DRIVE VIDEO PLAYER
function playMovie(movie) {
  if (!movie.id) {
    alert("Movie ID is missing.");
    return;
  }

  const modal = document.getElementById("playerModal");
  const playerBox = document.getElementById("playerBox");
  const message = document.getElementById("playerMessage");

  const oldFrame = document.getElementById("drivePlayer");
  if (oldFrame) oldFrame.remove();

  message.textContent = "Loading " + (movie.title || "movie") + "...";

  const iframe = document.createElement("iframe");

  iframe.id = "drivePlayer";
  iframe.src =
    "https://drive.google.com/file/d/" +
    encodeURIComponent(movie.id) +
    "/preview";

  iframe.allow = "autoplay; fullscreen";
  iframe.allowFullscreen = true;
  iframe.title = movie.title || "Movie player";

  playerBox.appendChild(iframe);

  modal.classList.add("show");
  document.body.style.overflow = "hidden";

  setTimeout(() => {
    message.textContent = "";
  }, 5000);
}

function closePlayer() {
  const modal = document.getElementById("playerModal");
  const iframe = document.getElementById("drivePlayer");

  if (iframe) iframe.remove();

  modal.classList.remove("show");
  document.body.style.overflow = "";
}

document.getElementById("closePlayer")
  .addEventListener("click", closePlayer);

document.getElementById("playerModal")
  .addEventListener("click", function(event) {
    if (event.target === this) closePlayer();
  });

document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") closePlayer();
});

// SEARCH
document.getElementById("searchBox")
  .addEventListener("input", function() {
    const query = this.value.trim().toLowerCase();

    const filtered = allMovies.filter(movie =>
      String(movie.title || "").toLowerCase().includes(query)
    );

    renderCatalogue(filtered);
  });

// THEME
document.getElementById("themeBtn")
  .addEventListener("click", function() {
    document.body.classList.toggle("light");
  });

// START
loadMovies();
</script>

</body>
</html>
